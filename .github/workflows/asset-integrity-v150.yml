name: LIVE v1.150 asset integrity diagnostics

on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths:
      - '.github/workflows/asset-integrity-v150.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIVE: https://play.143-198-217-75.sslip.io
    steps:
      - name: Recheck title assets and previously timed out ranges
        shell: bash
        run: |
          set -euo pipefail
          curl -k -fsS --max-time 60 "$LIVE/assets/packs/manifest.json" -o /tmp/manifest.json
          python3 - <<'PY'
          import gzip, hashlib, json, os, struct, ssl, urllib.request
          LIVE=os.environ['LIVE'].rstrip('/')
          m=json.load(open('/tmp/manifest.json','r',encoding='utf-8'))
          assert m.get('version') == 2, m.get('version')
          packs={p['path']:{**p,'group':g['name'],'load':g.get('load')} for g in m['groups'] for p in g['packs']}
          assets={a['path'].lower():a for a in m['assets']}
          print(f'MANIFEST_OK groups={len(m["groups"])} packs={len(packs)} assets={len(assets)}')
          wanted=[
            '/assets/cif/layouts/pstitle.json',
            '/assets/fonts/native-ui-font-atlas.json',
            '/assets/text/textuisystem.en.json',
            '/assets/cif/layouts/pscharacterselect_europe.json',
            '/assets/cif/layouts/pscharactercreate_europe.json',
            '/assets/cif/layouts/pscharactercreatechina.json',
          ]
          resolved={}
          for req in wanted:
            a=assets.get(req) or assets.get(req+'.gz')
            if not a: raise SystemExit(f'TITLE_RESOLVE_MISSING {req}')
            resolved[req]=a
            p=packs[a['packPath']]
            print(f'TITLE_RESOLVE request={req} actual={a["path"]} pack={a["packPath"]} group={p["group"]} load={p["load"]} length={a["length"]}')

          ctx=ssl.create_default_context()
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
          cache={}
          for req,a in resolved.items():
            pp=a['packPath']; p=packs[pp]
            if pp not in cache:
              r=urllib.request.Request(LIVE+pp,headers={'Accept-Encoding':'identity','User-Agent':'HieuSRO-title-integrity/1'})
              with opener.open(r,timeout=90) as resp: data=resp.read()
              if len(data)!=p['bytes']: raise SystemExit(f'PACK_LENGTH_BAD {pp} got={len(data)} expected={p["bytes"]}')
              got=hashlib.sha256(data).hexdigest()
              if got.lower()!=p['sha256'].lower(): raise SystemExit(f'PACK_SHA_BAD {pp} got={got} expected={p["sha256"]}')
              if data[:8]!=b'SROPACK2': raise SystemExit(f'PACK_MAGIC_BAD {pp}')
              hlen=struct.unpack_from('<I',data,8)[0]; start=12+hlen
              header=json.loads(data[12:start].decode('utf-8'))
              if header.get('format')!='sro-asset-pack' or header.get('version')!=2: raise SystemExit(f'PACK_HEADER_BAD {pp}')
              cache[pp]=(data,start,{x['path'].lower():x for x in header.get('files',[])})
              print(f'TITLE_PACK_OK pack={pp} bytes={len(data)} sha256={got}')
            data,start,hfiles=cache[pp]
            h=hfiles.get(a['path'].lower())
            if not h: raise SystemExit(f'HEADER_ENTRY_MISSING {a["path"]}')
            span=(a.get('stored') or {}).get('length',a['length'])
            raw=data[start+a['offset']:start+a['offset']+span]
            payload=gzip.decompress(raw) if isinstance(a.get('stored'),dict) else raw
            if len(payload)!=a['length']: raise SystemExit(f'ASSET_LENGTH_BAD {a["path"]}')
            got=hashlib.sha256(payload).hexdigest()
            if got.lower()!=a['sha256'].lower(): raise SystemExit(f'ASSET_SHA_BAD {a["path"]}')
            logical=gzip.decompress(payload) if a['path'].lower().endswith('.json.gz') else payload
            json.loads(logical.decode('utf-8'))
            print(f'TITLE_ASSET_OK request={req} actual={a["path"]} logical_bytes={len(logical)} sha256={got}')
          print('TITLE_ASSETS_ALL_OK=1')
          PY

          cat > /tmp/recheck.txt <<'EOF'
          /assets/packs/map-tiles-001-46eddad7dce3.bin 41512705
          /assets/packs/map-tiles-002-ee47a87e7ea3.bin 16812450
          /assets/packs/mission-minimap-001-b3a700551189.bin 33554348
          /assets/packs/mission-minimap-003-30e85139fb78.bin 31164141
          /assets/packs/mission-npc-vat-001-00edd27f6215.bin 3643351
          /assets/packs/texture-variants-astc-007-e2cee89f2c68.bin 16780297
          EOF
          failures=0
          while read -r path expected; do
            ok=0
            for attempt in 1 2 3; do
              : > /tmp/hdr
              if curl -k -sS --http2 --max-time 45 -H 'Range: bytes=0-11' -H 'Accept-Encoding: identity' -D /tmp/hdr -o /tmp/body "$LIVE$path"; then
                code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' /tmp/hdr)
                cr=$(awk 'BEGIN{IGNORECASE=1} /^content-range:/{gsub("\r",""); sub(/^content-range:[ ]*/,""); print}' /tmp/hdr | tail -1)
                src=$(awk 'BEGIN{IGNORECASE=1} /^x-hieusro-asset-source:/{gsub("\r",""); print $2}' /tmp/hdr | tail -1)
                cache=$(awk 'BEGIN{IGNORECASE=1} /^x-hieusro-asset-cache:/{gsub("\r",""); print $2}' /tmp/hdr | tail -1)
                n=$(wc -c </tmp/body | tr -d ' ')
                magic=$(head -c 8 /tmp/body || true)
                echo "RANGE_RECHECK path=$path attempt=$attempt status=$code bytes=$n content_range=$cr source=${src:-none} cache=${cache:-none} magic=$magic"
                if [ "$code" = 206 ] && [ "$n" = 12 ] && [ "$cr" = "bytes 0-11/$expected" ] && [ "$magic" = SROPACK2 ]; then ok=1; break; fi
              else
                echo "RANGE_RECHECK path=$path attempt=$attempt curl_failed=1"
              fi
            done
            if [ "$ok" != 1 ]; then echo "RANGE_RECHECK_FAILED path=$path"; failures=$((failures+1)); fi
          done < /tmp/recheck.txt
          echo "RANGE_RECHECK_SUMMARY failures=$failures"
          test "$failures" = 0
          echo 'HIEUSRO_V150_ASSET_RECHECK_OK=1'
