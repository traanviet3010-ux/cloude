name: Audit HieuSRO asset delivery and VPS network

on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/audit-asset-network.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hieusro-vps
    steps:
      - name: Audit public HTTP protocol, compression and cache headers
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://play.143-198-217-75.sslip.io'
          echo '=== PUBLIC EDGE / INDEX ==='
          curl -k -sS --http2 -o /tmp/index.html -D /tmp/index.h -H 'Accept-Encoding: gzip' "$LIVE/"
          awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^server:/ || /^content-type:/ || /^content-encoding:/ || /^cache-control:/ || /^alt-svc:/ || /^content-length:/' /tmp/index.h
          curl -k -sS --http2 -o /dev/null -w 'HTTP2 index: code=%{http_code} version=%{http_version} connect=%{time_connect}s tls=%{time_appconnect}s start=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n' "$LIVE/"
          if curl --help all 2>/dev/null | grep -q -- '--http3'; then
            curl -k -sS --http3 -o /dev/null -w 'HTTP3 index: code=%{http_code} version=%{http_version} total=%{time_total}s\n' "$LIVE/" || echo 'HTTP3 request failed from GitHub runner'
          else
            echo 'HTTP3 client test unavailable in runner curl; Alt-Svc will still be reported above.'
          fi

          echo '=== HASHED LOCAL ASSET ==='
          HASHED='/assets/entry-CJKUbK94.js'
          for enc in 'gzip' 'br' 'zstd'; do
            echo "-- Accept-Encoding: $enc"
            curl -k -sS --http2 -o /dev/null -D /tmp/hashed.h -H "Accept-Encoding: $enc" "$LIVE$HASHED"
            awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^content-type:/ || /^content-encoding:/ || /^cache-control:/ || /^alt-svc:/ || /^content-length:/' /tmp/hashed.h
          done

          echo '=== DISCOVER RUNTIME ASSET FROM PACKED CLIENT JS ==='
          : > /tmp/candidates.txt
          for js in assets/entry-CJKUbK94.js assets/entry-B5zvI0hO.js assets/bootstrap-BE_ylLXC.js; do
            curl -k -fsS "$LIVE/$js" -o "/tmp/$(basename "$js")" || true
          done
          grep -aEho '/assets/[A-Za-z0-9_./@%+:-]+\.(json|bin|glb|gltf|png|webp|jpg|jpeg|dds|ktx2|wasm)' /tmp/*.js 2>/dev/null \
            | sed 's/[?#].*$//' | sort -u > /tmp/candidates.txt || true
          head -n 40 /tmp/candidates.txt || true
          ASSET=''
          while IFS= read -r candidate; do
            case "$candidate" in
              /assets/entry-*|/assets/bootstrap-*|/assets/index-*|/assets/fonts/*) continue ;;
            esac
            code=$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 12 "$LIVE$candidate" || true)
            if [ "$code" = 200 ]; then ASSET="$candidate"; break; fi
          done < /tmp/candidates.txt
          if [ -z "$ASSET" ]; then
            echo 'No non-local runtime asset literal could be auto-discovered; using a known proxied text path for header/proxy comparison.'
            ASSET='/assets/text/textdataname.en.json'
          fi
          echo "ASSET_PATH=$ASSET" | tee /tmp/asset.env
          echo '-- LIVE asset headers --'
          curl -k -sS -o /dev/null -D /tmp/runtime.h -H 'Accept-Encoding: gzip' "$LIVE$ASSET" || true
          awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^server:/ || /^content-type:/ || /^content-encoding:/ || /^cache-control:/ || /^etag:/ || /^last-modified:/ || /^alt-svc:/ || /^content-length:/' /tmp/runtime.h || true
          echo '-- LIVE asset transfer --'
          curl -k -sS -o /dev/null -w 'live_asset code=%{http_code} version=%{http_version} size=%{size_download}B start=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n' "$LIVE$ASSET" || true

      - name: Configure pinned SSH trust
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST_KEY" && test -n "$VPS_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F 143.198.217.75 -f ~/.ssh/known_hosts >/dev/null

      - name: Run read-only VPS bandwidth and external-download audit
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/asset.env
          SAFE_ASSET=$(printf '%s' "$ASSET_PATH" | sed -E 's/[^A-Za-z0-9_./@%+:-]//g')
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            "ASSET_PATH='$SAFE_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          echo '=== VPS INFO ==='
          hostname
          uptime
          curl --version | head -n 2

          echo '=== VPS -> LIVE ==='
          curl -k -sS --http2 -o /dev/null -w 'vps_live code=%{http_code} version=%{http_version} connect=%{time_connect}s tls=%{time_appconnect}s start=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n' \
            'https://play.143-198-217-75.sslip.io/' || true

          echo '=== VPS SPEEDTEST (Cloudflare, no package install) ==='
          curl -L --fail -sS -o /dev/null \
            -w 'cf_download_25MB size=%{size_download}B total=%{time_total}s speed=%{speed_download}B/s\n' \
            'https://speed.cloudflare.com/__down?bytes=25000000'
          head -c 10000000 /dev/zero | curl -L --fail -sS -o /dev/null -X POST --data-binary @- \
            -w 'cf_upload_10MB total=%{time_total}s speed=%{speed_upload}B/s code=%{http_code}\n' \
            'https://speed.cloudflare.com/__up' || true

          echo '=== LARGE EXTERNAL FILE -> VPS DISK ==='
          TMP='/tmp/hieusro-network-audit-100m.bin'
          rm -f "$TMP"
          curl -L --fail -sS -o "$TMP" \
            -w 'external_100MB size=%{size_download}B total=%{time_total}s speed=%{speed_download}B/s code=%{http_code}\n' \
            'https://speed.cloudflare.com/__down?bytes=100000000'
          ls -lh "$TMP"
          rm -f "$TMP"

          echo '=== ASSET PATH COMPARISON FROM VPS ==='
          echo "asset=$ASSET_PATH"
          curl -k -sS -o /dev/null \
            -w 'via_live code=%{http_code} version=%{http_version} size=%{size_download}B start=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n' \
            "https://play.143-198-217-75.sslip.io$ASSET_PATH" || true
          curl -sS -o /dev/null \
            -w 'direct_origin code=%{http_code} version=%{http_version} size=%{size_download}B start=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s\n' \
            "https://opensro.online$ASSET_PATH" || true
          REMOTE

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
