name: Audit HieuSRO VPS live status
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/audit-vps-live-status.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    steps:
      - name: Configure pinned SSH trust
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST_KEY" && test -n "$VPS_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Read allowlisted status
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 '/usr/local/sbin/hieusro-ops status'
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
