name: Build OpenSRO v1.150 game data

on:
  push:
    paths:
      - .github/workflows/build-opensro-v150-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-game-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPEN_SRO_COMMIT: 4f6919d6900d169b89e75647e56c99ca8ebd5cfb
      SRO_BUILD_JOBS: "2"
      SRO_FONT_ARIAL: /usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf
      SRO_FONT_ARIAL_BOLD: /usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation2 git
          python -m pip install --upgrade pip gdown
          corepack enable

      - name: Checkout pinned OpenSRO source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/opensro-dev/opensro.git opensro
          cd opensro
          git checkout "$OPEN_SRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$OPEN_SRO_COMMIT"

      - name: Install OpenSRO build dependencies
        shell: bash
        working-directory: opensro
        run: |
          set -euxo pipefail
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile
          python -m pip install -r requirements-build.txt

      - name: Download and reconstruct licensed v1.150 client
        shell: bash
        run: |
          set -euxo pipefail
          export SRO_GAME_ROOT="$RUNNER_TEMP/sro-v150"
          mkdir -p "$SRO_GAME_ROOT/parts"

          python -m gdown 1a9nxRMoQTWoGK-ALioDeMKb4oHmiyhHV -O "$SRO_GAME_ROOT/parts/Data.pk2.part001"
          python -m gdown 1a3dCk5AXcdBMFv6cj6d28ANljV44lNEG -O "$SRO_GAME_ROOT/parts/Data.pk2.part002"
          python -m gdown 1v5cATpME3j0gd4Y1U0CKPJd34TJiPALE -O "$SRO_GAME_ROOT/parts/Data.pk2.part003"
          python -m gdown 1x-Sc0UBJyrbLe2vxFjAacH24L5squMZv -O "$SRO_GAME_ROOT/parts/Data.pk2.part004"
          python -m gdown 16gSz_ayYwx5rDv8ApykDzCB-2yJqCRk9 -O "$SRO_GAME_ROOT/parts/Data.pk2.part005"
          python -m gdown 1HmfbVLwnsnzzvy0I385Hi81PC4TazrQL -O "$SRO_GAME_ROOT/parts/Data.pk2.part006"
          python -m gdown 1Vw2D5furmvXlel0tbO3NlyhUma2w3SF4 -O "$SRO_GAME_ROOT/parts/Data.pk2.part007"

          python -m gdown 1-oxLttv6iroHl0lVlWuHYpO0s-x8nfZE -O "$SRO_GAME_ROOT/parts/Map.pk2.part001"
          python -m gdown 18yHbcPW7MJkO6xkAvVbvm7YpImNeX75X -O "$SRO_GAME_ROOT/parts/Map.pk2.part002"
          python -m gdown 1EmkjOnttSAOMDKK0TC19tBB9Aqwzl2-E -O "$SRO_GAME_ROOT/parts/Map.pk2.part003"
          python -m gdown 1Sjb5dGFfRsp14G8DmdVA-JcqsG6o10B9 -O "$SRO_GAME_ROOT/parts/Map.pk2.part004"

          cat "$SRO_GAME_ROOT"/parts/Data.pk2.part* > "$SRO_GAME_ROOT/Data.pk2"
          cat "$SRO_GAME_ROOT"/parts/Map.pk2.part* > "$SRO_GAME_ROOT/Map.pk2"

          python -m gdown 12IeBgOHIhHwQrI3xmJFcZnpGmmm8HALL -O "$SRO_GAME_ROOT/Media.pk2"
          python -m gdown 1GsrE_kpupG7S9KwM7BPyF0BhCO_DXtcu -O "$SRO_GAME_ROOT/Particles.pk2"
          python -m gdown 1qPWMF0X5Zh53SNAIwbqLjTnVxdxs4DtV -O "$SRO_GAME_ROOT/Music.pk2"
          python -m gdown 1rFcGDDheK1OBSVJEKS5Z5_PMqBeTN2Oy -O "$SRO_GAME_ROOT/SRO_Client.exe"

          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'sro-v150'
          expected = {
              'Data.pk2': 1342164992,
              'Map.pk2': 621858816,
              'Media.pk2': 289288192,
              'Particles.pk2': 68116480,
              'Music.pk2': 35569664,
              'SRO_Client.exe': 9383936,
          }
          for name, expected_size in expected.items():
              actual = (root / name).stat().st_size
              print(f'{name}: {actual} bytes')
              assert actual == expected_size, (name, actual, expected_size)
          print('All licensed client input sizes match exactly.')
          PY

          rm -rf "$SRO_GAME_ROOT/parts"
          echo "SRO_GAME_ROOT=$SRO_GAME_ROOT" >> "$GITHUB_ENV"

      - name: Prepare retail assets
        shell: bash
        working-directory: opensro
        run: corepack pnpm assets prepare

      - name: Diagnose asset inputs
        shell: bash
        working-directory: opensro
        run: corepack pnpm assets doctor

      - name: Build full assets
        shell: bash
        working-directory: opensro
        run: corepack pnpm assets build full

      - name: Verify publication ledger
        shell: bash
        working-directory: opensro
        run: corepack pnpm assets ledger

      - name: Build server.srogz
        shell: bash
        working-directory: opensro
        run: |
          set -euxo pipefail
          corepack pnpm task build server-game-data
          test -s apps/server/.generated/game-data/1.150/server.srogz
          sha256sum apps/server/.generated/game-data/1.150/server.srogz | tee server-srogz.sha256
          ls -lh apps/server/.generated/game-data/1.150/server.srogz

      - name: Verify built asset integrity
        shell: bash
        working-directory: opensro
        run: corepack pnpm assets check integrity

      - name: Upload server game-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensro-v150-server-game-data
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            opensro/apps/server/.generated/game-data/1.150/server.srogz
            opensro/server-srogz.sha256
