name: Diagnose HieuSRO LIVE boot
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/diagnose-live-boot.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Inspect containers and game log
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            "sudo -n bash -lc 'docker ps -a; echo ===GAME===; docker logs --tail 120 digitalocean-game-1 2>&1; echo ===CADDY===; docker logs --tail 40 digitalocean-caddy-1 2>&1'"
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
