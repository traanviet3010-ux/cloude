name: Diagnose HieuSRO TEST server list upstream (read-only)

on:
  push:
    branches:
      - hieusro-mobile-stability-v1-20261020
    paths:
      - '.github/workflows/diagnose-mobile-test-servers.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'traanviet3010-ux/cloude'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Probe Render TEST title-server endpoints, without credentials
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, time
          origins={
            'mobile-lite':'https://hieusro-mobile-lite-20261020.onrender.com',
            'icons-preview':'https://hieusro-icons-preview-20261019.onrender.com',
            'drive-test':'https://hieusro-drive-test-20261019.onrender.com',
            'game-server':'https://hieusro-game-server.onrender.com',
          }
          paths=['/__mobile/health','/healthz','/readyz','/api/title/servers','/assets/images/Media_extracted/interface/loading/nowloading.png']
          def probe(item):
            name,path=item; url=origins[name]+path
            req=urllib.request.Request(url,headers={'X-OpenSRO-Protocol':'6','Accept-Encoding':'identity','User-Agent':'HieuSRO-TEST-ReadOnly-Probe/1.0'})
            started=time.monotonic()
            try:
              with urllib.request.urlopen(req,timeout=18) as r:
                data=r.read(256) if path.endswith('servers') else b''
                return name,path,r.status,r.headers.get('Content-Type',''),r.headers.get('Server',''),round(time.monotonic()-started,2),data[:100].hex()
            except urllib.error.HTTPError as e:
              return name,path,e.code,e.headers.get('Content-Type',''),e.headers.get('Server',''),round(time.monotonic()-started,2),'HTTP_ERROR'
            except Exception as e:
              return name,path,'ERR',type(e).__name__,'',round(time.monotonic()-started,2),str(e)[:100]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            for row in pool.map(probe,[(n,p) for n in origins for p in paths]):
              print('TEST_PROBE',*row,sep=' | ',flush=True)
          PY
