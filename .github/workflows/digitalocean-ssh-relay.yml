name: DigitalOcean SSH relay
# relay-trigger: 2026-10-13T09:29Z

on:
  push:
    branches:
      - hieusro-digitalocean
    paths:
      - .github/workflows/digitalocean-ssh-relay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hieusro-digitalocean
          fetch-depth: 1

      - name: Publish one-time encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/relay-private.pem
          openssl pkey -in /tmp/relay-private.pem -pubout -out /tmp/relay-public.pem
          mkdir -p deploy/digitalocean/relay
          cp /tmp/relay-public.pem deploy/digitalocean/relay/runner-public.pem
          git config user.name github-actions-hieusro
          git config user.email actions@github.com
          git add deploy/digitalocean/relay/runner-public.pem
          git commit -m "Publish one-time DigitalOcean relay key"
          git push origin HEAD:hieusro-digitalocean

      - name: Wait for encrypted SSH credential and manage server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/deploy/digitalocean/relay/ssh-key.enc?ref=hieusro-digitalocean"
          for attempt in $(seq 1 90); do
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "$API" -o /tmp/ssh-key.enc.b64; then
              break
            fi
            echo "Waiting for encrypted credential ($attempt/90)"
            sleep 5
          done
          test -s /tmp/ssh-key.enc.b64
          base64 -d /tmp/ssh-key.enc.b64 >/tmp/ssh-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/relay-private.pem -in /tmp/ssh-key.enc -out /tmp/id_ed25519 \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/id_ed25519

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i /tmp/id_ed25519 root@143.198.217.75 'bash -s' <<'REMOTE'
          set -u
          echo "=== Managed HieuSRO droplet ==="
          hostname
          uname -a
          echo "=== Ensure installer service ==="
          if [ ! -f /etc/systemd/system/hieusro-install.service ]; then
            curl -fsSL --retry 10 --retry-delay 3 --retry-all-errors \
              https://raw.githubusercontent.com/traanviet3010-ux/cloude/hieusro-digitalocean/deploy/digitalocean/install.sh \
              -o /root/hieusro-install.sh
            chmod 700 /root/hieusro-install.sh
            cat >/etc/systemd/system/hieusro-install.service <<'UNIT'
          [Unit]
          Description=HieuSRO managed installer
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/root/hieusro-install.sh
          RemainAfterExit=yes
          StandardOutput=append:/var/log/hieusro-install.log
          StandardError=append:/var/log/hieusro-install.log

          [Install]
          WantedBy=multi-user.target
          UNIT
            systemctl daemon-reload
            systemctl enable hieusro-install.service
          fi
          if ! systemctl is-active --quiet hieusro-install.service; then
            systemctl start --no-block hieusro-install.service
          fi
          echo "=== Install status ==="
          systemctl status --no-pager --lines=30 hieusro-install.service || true
          echo "=== Install log ==="
          tail -n 100 /var/log/hieusro-install.log 2>/dev/null || true
          echo "=== Processes ==="
          ps -eo pid,ppid,%cpu,%mem,etime,cmd --sort=-%cpu | head -n 25 || true
          echo "=== Docker ==="
          docker ps -a 2>/dev/null || true
          echo "=== Disk and memory ==="
          free -h || true
          df -h / || true
          swapon --show || true
          REMOTE

      - name: Remove relay files from branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch origin hieusro-digitalocean
          git reset --hard origin/hieusro-digitalocean
          git config user.name github-actions-hieusro
          git config user.email actions@github.com
          git rm -f deploy/digitalocean/relay/runner-public.pem deploy/digitalocean/relay/ssh-key.enc 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Clean one-time DigitalOcean relay files"
            git push origin HEAD:hieusro-digitalocean
          fi
