name: DigitalOcean SSH relay
# relay-trigger: 2026-10-13T22:31+07:00-test-shard-deploy

on:
  push:
    branches:
      - hieusro-digitalocean
    paths:
      - .github/workflows/digitalocean-ssh-relay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hieusro-digitalocean
          fetch-depth: 1

      - name: Publish one-time encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/relay-private.pem
          openssl pkey -in /tmp/relay-private.pem -pubout -out /tmp/relay-public.pem
          mkdir -p deploy/digitalocean/relay
          cp /tmp/relay-public.pem deploy/digitalocean/relay/runner-public.pem
          git config user.name github-actions-hieusro
          git config user.email actions@github.com
          git add deploy/digitalocean/relay/runner-public.pem
          git commit -m "Publish one-time DigitalOcean relay key"
          git push origin HEAD:hieusro-digitalocean

      - name: Wait for encrypted SSH credential and deploy TEST
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/deploy/digitalocean/relay/ssh-key.enc?ref=hieusro-digitalocean"
          for attempt in $(seq 1 120); do
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "$API" -o /tmp/ssh-key.enc.b64; then
              break
            fi
            echo "Waiting for encrypted credential ($attempt/120)"
            sleep 5
          done
          test -s /tmp/ssh-key.enc.b64
          base64 -d /tmp/ssh-key.enc.b64 >/tmp/ssh-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/relay-private.pem -in /tmp/ssh-key.enc -out /tmp/id_ed25519 \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/id_ed25519

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i /tmp/id_ed25519 root@143.198.217.75 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== Managed HieuSRO TEST deployment ==="
          hostname
          date -Is
          echo "=== Pre-deploy containers ==="
          docker ps -a || true
          echo "=== Stop periodic updater during managed deploy ==="
          systemctl stop hieusro-autoupdate.timer || true
          trap 'systemctl start hieusro-autoupdate.timer >/dev/null 2>&1 || true' EXIT
          echo "=== Deploy latest hieusro-digitalocean ==="
          /opt/hieusro/src/deploy/digitalocean/update.sh
          git -C /opt/hieusro/src rev-parse HEAD >/opt/hieusro/.deployed-sha
          echo "=== Post-deploy containers ==="
          docker ps -a
          echo "=== Recent update log ==="
          tail -n 120 /var/log/hieusro-update.log 2>/dev/null || true
          echo "=== Resource state ==="
          free -h || true
          df -h / || true
          swapon --show || true
          REMOTE

      - name: Verify LIVE and TEST publicly
        run: |
          set -euo pipefail
          SERVERS='https://play.143-198-217-75.sslip.io/api/title/servers'
          TEST_READY='https://play.143-198-217-75.sslip.io/shards/hieusro-test/transport/readyz'
          for attempt in $(seq 1 80); do
            echo "Verification $attempt/80"
            if curl -kfsS --max-time 15 -H 'X-OpenSRO-Protocol: 6' "$SERVERS" -o /tmp/servers.json \
              && curl -kfsS --max-time 15 "$TEST_READY" -o /tmp/test-ready.txt \
              && python - <<'PY'
          import json
          rows = json.load(open('/tmp/servers.json'))
          by_id = {r.get('id'): r for r in rows if isinstance(r, dict)}
          live = by_id.get('global-official')
          test = by_id.get('hieusro-test')
          assert live and live.get('name') == 'HieuSRO' and live.get('operating') is True, rows
          assert test and test.get('name') == 'HieuSRO TEST' and test.get('operating') is True, rows
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
            then
              test "$(cat /tmp/test-ready.txt)" = 'ready'
              echo 'HieuSRO LIVE + TEST verified.'
              exit 0
            fi
            sleep 10
          done
          echo 'TEST verification timed out.' >&2
          cat /tmp/servers.json 2>/dev/null || true
          cat /tmp/test-ready.txt 2>/dev/null || true
          exit 1

      - name: Remove relay files from branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git fetch origin hieusro-digitalocean
          git reset --hard origin/hieusro-digitalocean
          git config user.name github-actions-hieusro
          git config user.email actions@github.com
          git rm -f deploy/digitalocean/relay/runner-public.pem deploy/digitalocean/relay/ssh-key.enc 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Clean one-time DigitalOcean relay files"
            git push origin HEAD:hieusro-digitalocean
          fi

      - name: Mark relay cleanup commit as deployed
        if: success()
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -i /tmp/id_ed25519 root@143.198.217.75 'bash -s' <<'REMOTE'
          set -euo pipefail
          git -C /opt/hieusro/src fetch origin hieusro-digitalocean
          git -C /opt/hieusro/src reset --hard origin/hieusro-digitalocean
          git -C /opt/hieusro/src rev-parse HEAD >/opt/hieusro/.deployed-sha
          systemctl start hieusro-autoupdate.timer || true
          echo "Relay cleanup synchronized without rebuilding runtime."
          REMOTE
