name: Fix HieuSRO deploy executable bits
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/fix-deploy-executable-bits.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hieusro-digitalocean
          fetch-depth: 0
      - name: Make deployment scripts executable and push
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/digitalocean/install.sh deploy/digitalocean/update.sh deploy/digitalocean/update-if-needed.sh deploy/digitalocean/backup.sh
          git config user.name 'traanviet3010-ux'
          git config user.email 'traanviet3010@gmail.com'
          git add deploy/digitalocean/install.sh deploy/digitalocean/update.sh deploy/digitalocean/update-if-needed.sh deploy/digitalocean/backup.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo EXEC_BITS_ALREADY_OK=1
            exit 0
          fi
          git commit -m 'Ops: preserve executable bits on deployment scripts'
          git push origin HEAD:hieusro-digitalocean
          echo EXEC_BITS_FIXED=1
