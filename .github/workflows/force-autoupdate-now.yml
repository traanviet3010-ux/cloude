name: Trigger HieuSRO production auto-update
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/force-autoupdate-now.yml']
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Start existing auto-update service now
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            'sudo -n systemctl start hieusro-autoupdate.service && echo HIEUSRO_AUTOUPDATE_TRIGGERED=1'
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
