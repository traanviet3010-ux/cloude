name: Force production runtime LIVE-only
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/force-live-only-runtime.yml']
permissions:
  contents: write
jobs:
  force-live-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: hieusro-digitalocean
          fetch-depth: 0
      - name: Replace TEST runtime with LIVE-only runtime and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hieusro-runtime-live
          git show origin/hieusro-runtime-live:server-build/runtime-start.sh > server-build/runtime-start.sh
          git show origin/hieusro-runtime-live:server-build/runtime-nginx.conf > server-build/runtime-nginx.conf
          git show origin/hieusro-runtime-live:server-build/runtime-shards.json > server-build/runtime-shards.json
          git config user.name 'traanviet3010-ux'
          git config user.email 'traanviet3010@gmail.com'
          git add server-build/runtime-start.sh server-build/runtime-nginx.conf server-build/runtime-shards.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo LIVE_ONLY_ALREADY=1
            exit 0
          fi
          git commit -m 'Production: remove all TEST runtime paths'
          git push origin HEAD:hieusro-digitalocean
          echo LIVE_ONLY_PUSHED=1
