name: HieuSRO Render External Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hieusro-render-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-render-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public frontend and game APIs without modifying characters
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://hieusro-drive-test-20261019.onrender.com"
          ok=0
          for i in $(seq 1 12); do
            echo "Smoke attempt $i"
            status=$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/hieusro-index.html -w '%{http_code}' "$BASE/" || true)
            if [[ "$status" == "200" ]] && grep -Eiq '<html|/assets/.*js' /tmp/hieusro-index.html; then
              ok=1
              break
            fi
            echo "index status=$status, checking again"
            sleep 10
          done
          [[ "$ok" == 1 ]] || { echo "ERROR: homepage did not return browser client HTML"; exit 1; }

          echo "Testing public Agent readyz via Nginx"
          curl --fail-with-body -sS --connect-timeout 10 --max-time 25 "$BASE/readyz" > /tmp/hieusro-ready
          echo "Testing public server catalogue via Nginx (no self-proxy loops)"
          curl --fail-with-body -sS -H "X-OpenSRO-Protocol: 6" --connect-timeout 10 --max-time 25 "$BASE/api/title/servers" > /tmp/hieusro-title.json
          grep -q 'HieuSRO' /tmp/hieusro-title.json
          echo "PASS: HTTP homepage, Agent readiness, and HieuSRO server catalogue."

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag != "script": return
                  for key, value in attrs:
                      if key == "src" and value and value.startswith("/assets/"):
                          self.scripts.append(value)
          parser = Scripts()
          parser.feed(Path("/tmp/hieusro-index.html").read_text(encoding="utf-8"))
          if not parser.scripts: raise SystemExit("No module script referenced by browser HTML")
          Path("/tmp/hieusro-script-path").write_text(parser.scripts[0])
          print("Browser module:", parser.scripts[0])
          PY
          script_path=$(cat /tmp/hieusro-script-path)
          curl --fail-with-body -sS -L --connect-timeout 10 --max-time 35 "$BASE$script_path" -o /tmp/hieusro-module.js
          [[ $(wc -c < /tmp/hieusro-module.js) -gt 1000 ]]
          echo "PASS: browser JS module delivered successfully."
          grep -q 'hieusro:auto-train:radius:v1' /tmp/hieusro-module.js || {
            echo "ERROR: Render browser bundle does not contain Auto Train stage1 controller";
            exit 1;
          }
          grep -q 'AUTO TRAIN' /tmp/hieusro-module.js || {
            echo "ERROR: Auto Train UI is missing from the served browser bundle";
            exit 1;
          }
          echo "PASS: full Auto Train UI + controller shipped on the public Render URL."

