name: HieuSRO secure VPS operations

# Manual-only. No push trigger, arbitrary shell input, or one-time credentials in git.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Approved operation"
        type: choice
        required: true
        options:
          - status
          - test-health

permissions:
  contents: read

concurrency:
  group: hieusro-vps-operations
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hieusro-vps
    steps:
      - name: Validate request
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            status|test-health) ;;
            *) echo "::error::Unsupported operation"; exit 1 ;;
          esac

      - name: Configure pinned SSH trust
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST_KEY" && test -n "$VPS_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F 143.198.217.75 -f ~/.ssh/known_hosts >/dev/null

      - name: Execute allowlisted operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            status|test-health) ;;
            *) exit 2 ;;
          esac
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            "$OPERATION"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
