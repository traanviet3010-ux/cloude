name: Hotfix HieuSRO LIVE frontend route
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/hotfix-live-frontend-route.yml']
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Reload only LIVE nginx frontend route
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            "sudo -n bash -lc 'set -euo pipefail; cd /opt/hieusro/src/deploy/digitalocean; grep -q \"proxy_pass http://127.0.0.1:8795\" /opt/hieusro/src/server-build/runtime-nginx.conf; docker compose --env-file .env -f compose.yml exec -T game cp /opt/hieusro/runtime-nginx.conf /tmp/runtime-nginx.conf.pre-frontend-hotfix; cat /opt/hieusro/src/server-build/runtime-nginx.conf | docker compose --env-file .env -f compose.yml exec -T game sh -c \"cat > /tmp/runtime-nginx.conf.hotfix\"; docker compose --env-file .env -f compose.yml exec -T game nginx -t -c /tmp/runtime-nginx.conf.hotfix; docker compose --env-file .env -f compose.yml exec -T game sh -c \"cp /tmp/runtime-nginx.conf.hotfix /opt/hieusro/runtime-nginx.conf && nginx -s reload -c /opt/hieusro/runtime-nginx.conf\"; echo HIEUSRO_LIVE_NGINX_RELOADED=1'"
      - name: Verify LIVE HTML and backend
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://play.143-198-217-75.sslip.io'
          for attempt in $(seq 1 30); do
            root_code=$(curl -k -sS -o /tmp/root -w '%{http_code}' --max-time 15 "$LIVE/" || true)
            cat_code=$(curl -k -sS -H 'X-OpenSRO-Protocol: 6' -o /tmp/catalog -w '%{http_code}' --max-time 15 "$LIVE/api/title/servers" || true)
            test_code=$(curl -k -sS -o /tmp/test -w '%{http_code}' --max-time 15 "$LIVE/shards/hieusro-test/transport/readyz" || true)
            echo "attempt=$attempt root=$root_code catalog=$cat_code removed_test=$test_code"
            if [ "$root_code" = 200 ] && [ "$cat_code" = 200 ] && [ "$test_code" = 404 ] && ! grep -q 'runtime gateway online' /tmp/root && grep -Eqi '<!doctype|<html' /tmp/root; then
              echo HIEUSRO_LIVE_FRONTEND_REPAIRED=1
              head -c 200 /tmp/root; echo
              cat /tmp/catalog; echo
              exit 0
            fi
            sleep 3
          done
          echo 'LIVE frontend verification failed.' >&2
          head -c 300 /tmp/root 2>/dev/null || true
          exit 1
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
