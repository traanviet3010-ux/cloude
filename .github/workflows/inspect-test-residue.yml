name: Inspect HieuSRO TEST residue
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/inspect-test-residue.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Inspect only TEST residue and production volume paths
        shell: bash
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            "sudo -n bash -lc '
              echo ===VOLUMES===; docker volume ls;
              echo ===GAME_STATE_MOUNT===; docker volume inspect digitalocean_game_state --format {{.Mountpoint}};
              ROOT=$(docker volume inspect digitalocean_game_state --format {{.Mountpoint}});
              echo ===FILES_CONTAINING_TEST_SHARD===;
              grep -RIl --exclude=accounts.json --exclude=state.db --exclude=\*.db hieusro-test \"$ROOT\" 2>/dev/null || true;
              echo ===TEST_STATE_DIRS===;
              find \"$ROOT\" -maxdepth 5 -type d -name \"*hieusro-test*\" -print 2>/dev/null || true;
              echo ===TEST_CONTAINERS===;
              docker ps -a --format \"{{.ID}} {{.Names}} {{.Image}} {{.Status}}\" | grep -Ei \"test|diagnostic|phase|candidate\" || true;
              echo ===PRODUCTION_CONTAINERS===;
              docker ps -a --format \"{{.Names}} {{.Status}}\" | grep -E \"^digitalocean-(game|portal|redis|caddy)-1 \" || true;
            '"
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
