name: Audit PHUONGHOANG90 client archive

on:
  push:
    branches: [hieusro-phuonghoang90-client]
    paths:
      - '.github/workflows/phuonghoang90-client-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full binutils file python3-pip
          python3 -m pip install --user --break-system-packages gdown

      - name: Download exact Drive archive
        env:
          DRIVE_FILE_ID: 1BGHeEvfQYFGuTw90QR6bYUXrfH-V-hjo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phuonghoang90"
          cd "$RUNNER_TEMP/phuonghoang90"
          ~/.local/bin/gdown --id "$DRIVE_FILE_ID" -O PHUONGHOANG90.rar
          test -s PHUONGHOANG90.rar
          stat -c 'ARCHIVE_SIZE=%s' PHUONGHOANG90.rar
          sha256sum PHUONGHOANG90.rar | tee archive.sha256
          file PHUONGHOANG90.rar | tee archive.file

      - name: List and extract archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phuonghoang90"
          7z l PHUONGHOANG90.rar | tee archive-list.txt
          mkdir extracted
          7z x -y -oextracted PHUONGHOANG90.rar | tee extract.log
          find extracted -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort | tee extracted-files.txt

      - name: Inspect Silkroad client binaries and config
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phuonghoang90"
          ROOT=extracted
          {
            echo '=== ARCHIVE ==='
            cat archive.sha256
            cat archive.file
            echo
            echo '=== IMPORTANT FILES ==='
            find "$ROOT" -type f \( -iname 'SRO_Client.exe' -o -iname 'Silkroad.exe' -o -iname 'Media.pk2' -o -iname 'Data.pk2' -o -iname 'Map.pk2' -o -iname 'Particles.pk2' -o -iname 'Music.pk2' -o -iname 'SilkRoadGlobal.ini' -o -iname 'silkcfg.dat' \) -printf '%p\t%s bytes\n' | sort
            echo
            echo '=== PE INFO ==='
            while IFS= read -r f; do
              echo "--- $f"
              file "$f"
              objdump -x "$f" 2>/dev/null | grep -E 'file format|ImageBase|Subsystem|MajorSubsystemVersion|MinorSubsystemVersion|Time/Date|DLL Name' | head -n 80 || true
              echo '--- strings: version/network hints'
              strings -a -n 5 "$f" | grep -Eai 'version|gateway|server|silkroad|division|locale|joymax|[0-9]{1,3}(\.[0-9]{1,3}){3}|\.com|\.net' | head -n 160 || true
            done < <(find "$ROOT" -type f \( -iname 'SRO_Client.exe' -o -iname 'Silkroad.exe' \) | sort)
            echo
            echo '=== SMALL CONFIG FILES ==='
            while IFS= read -r f; do
              size=$(stat -c %s "$f")
              if [ "$size" -le 1048576 ]; then
                echo "--- $f ($size bytes)"
                strings -a -n 2 "$f" | head -n 300 || true
              fi
            done < <(find "$ROOT" -type f \( -iname '*.ini' -o -iname '*.cfg' -o -iname '*.dat' \) | sort)
          } | tee client-audit.txt

      - name: Upload audit report only
        uses: actions/upload-artifact@v4
        with:
          name: PHUONGHOANG90-client-audit
          path: |
            ${{ runner.temp }}/phuonghoang90/client-audit.txt
            ${{ runner.temp }}/phuonghoang90/extracted-files.txt
            ${{ runner.temp }}/phuonghoang90/archive-list.txt
            ${{ runner.temp }}/phuonghoang90/archive.sha256
          if-no-files-found: error
          retention-days: 7
