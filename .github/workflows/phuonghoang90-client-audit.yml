name: Audit PHUONGHOANG90 client archive

on:
  push:
    branches: [hieusro-phuonghoang90-client]
    paths:
      - '.github/workflows/phuonghoang90-client-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full unar binutils file python3-pip curl
          python3 -m pip install --user --break-system-packages gdown pycryptodome

      - name: Download exact Drive archive
        env:
          DRIVE_FILE_ID: 1BGHeEvfQYFGuTw90QR6bYUXrfH-V-hjo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phuonghoang90"
          cd "$RUNNER_TEMP/phuonghoang90"
          ~/.local/bin/gdown "$DRIVE_FILE_ID" -O PHUONGHOANG90.rar
          test -s PHUONGHOANG90.rar
          stat -c 'ARCHIVE_SIZE=%s' PHUONGHOANG90.rar
          sha256sum PHUONGHOANG90.rar | tee archive.sha256
          grep -q '^b081c94db008de4d3a7e418a159027b1a75aef8d03e6768efff871f7e5c3e595 ' archive.sha256
          file PHUONGHOANG90.rar | tee archive.file

      - name: Extract exact client binaries and Media PK2
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phuonghoang90"
          7z l PHUONGHOANG90.rar | tee archive-list.txt
          mkdir -p extracted
          unar -f -o extracted PHUONGHOANG90.rar \
            'PHUONGHOANG90/sro_client.exe' \
            'PHUONGHOANG90/silkroad.exe' \
            'PHUONGHOANG90/Silkroad_Api.dll' \
            'PHUONGHOANG90/silkcfg.dat' \
            'PHUONGHOANG90/Silkload.dat' \
            'PHUONGHOANG90/Media.pk2' \
            'PHUONGHOANG90/setting/gmwpfort.dat' \
            'PHUONGHOANG90/setting/SROptionSet.dat' \
            'PHUONGHOANG90/temppath/DNINF.dat' | tee extract.log
          find extracted -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort | tee extracted-files.txt
          test -f extracted/PHUONGHOANG90/sro_client.exe
          test -f extracted/PHUONGHOANG90/silkroad.exe
          test -f extracted/PHUONGHOANG90/Media.pk2

      - name: Read division version gateway from exact Media PK2
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phuonghoang90"
          curl -fsSL 'https://raw.githubusercontent.com/opensro-dev/opensro/4f6919d6900d169b89e75647e56c99ca8ebd5cfb/scripts/sro_pk2.py' -o sro_pk2.py
          cat > inspect_media.py <<'PY'
          import mmap, os, sys
          from sro_pk2 import read_directory, payload

          media = 'extracted/PHUONGHOANG90/Media.pk2'
          wanted_words = ('division', 'version', 'gateway', 'server', 'locale', 'patch', 'download')
          exact_names = {
              'divisioninfo.txt', 'version.txt', 'gateway.txt', 'serverinfo.txt',
              'locale.txt', 'divisioninfo.dat', 'version.dat'
          }
          with open(media, 'rb') as f:
              mm = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
              entries = read_directory(mm)
              print(f'MEDIA_SIZE={len(mm)}')
              print(f'MEDIA_ENTRY_COUNT={len(entries)}')
              matches = []
              for e in entries:
                  low = e.path.lower()
                  base = low.rsplit('/', 1)[-1]
                  if base in exact_names or any(w in low for w in wanted_words):
                      matches.append(e)
              print('=== PATH MATCHES ===')
              for e in matches[:500]:
                  print(f'{e.path}\t{e.size}')
              print('=== SMALL MATCH PAYLOADS ===')
              for e in matches:
                  if e.size > 1024 * 1024:
                      continue
                  data = bytes(payload(mm, e))
                  print(f'--- {e.path} ({e.size} bytes)')
                  print('HEX=' + data[:512].hex())
                  for enc in ('utf-8', 'cp949', 'latin1', 'utf-16le'):
                      try:
                          text = data.decode(enc).replace('\x00', '\\0')
                      except Exception:
                          continue
                      printable = sum(ch.isprintable() or ch in '\r\n\t' for ch in text)
                      if text and printable / max(len(text), 1) > 0.6:
                          print(f'TEXT[{enc}]={text[:3000]!r}')
                          break
              mm.close()
          PY
          python3 inspect_media.py | tee media-network-metadata.txt

      - name: Inspect Silkroad binaries and config
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phuonghoang90"
          ROOT=extracted/PHUONGHOANG90
          {
            echo '=== SOURCE ARCHIVE ==='
            echo 'Drive file id: 1BGHeEvfQYFGuTw90QR6bYUXrfH-V-hjo'
            cat archive.sha256
            cat archive.file
            echo
            echo '=== IMPORTANT FILES IN ARCHIVE ==='
            grep -Ei 'Data\.pk2|Map\.pk2|Media\.pk2|Particles\.pk2|Music\.pk2|sro_client\.exe|silkroad\.exe|Silkroad_Api\.dll|silkcfg\.dat|Silkload\.dat' archive-list.txt || true
            echo
            echo '=== HASHES ==='
            sha256sum "$ROOT/sro_client.exe" "$ROOT/silkroad.exe" "$ROOT/Silkroad_Api.dll" "$ROOT/silkcfg.dat" "$ROOT/Silkload.dat" "$ROOT/Media.pk2"
            echo
            echo '=== PE INFO ==='
            for f in "$ROOT/sro_client.exe" "$ROOT/silkroad.exe" "$ROOT/Silkroad_Api.dll"; do
              echo "--- $f"
              file "$f"
              objdump -x "$f" 2>/dev/null | grep -E 'file format|ImageBase|Subsystem|MajorSubsystemVersion|MinorSubsystemVersion|Time/Date|DLL Name' | head -n 120 || true
              strings -a -n 4 "$f" | grep -Eai 'version|gateway|server|silkroad|division|locale|joymax|vsro|isro|[0-9]{1,3}(\.[0-9]{1,3}){3}|\.com|\.net|15779' | head -n 260 || true
            done
          } | tee client-audit.txt

      - name: Upload audit report only
        uses: actions/upload-artifact@v4
        with:
          name: PHUONGHOANG90-client-audit
          path: |
            ${{ runner.temp }}/phuonghoang90/client-audit.txt
            ${{ runner.temp }}/phuonghoang90/media-network-metadata.txt
            ${{ runner.temp }}/phuonghoang90/extracted-files.txt
            ${{ runner.temp }}/phuonghoang90/archive-list.txt
            ${{ runner.temp }}/phuonghoang90/archive.sha256
          if-no-files-found: error
          retention-days: 7
