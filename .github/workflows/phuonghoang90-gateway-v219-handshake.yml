name: TEST PHUONGHOANG90 MySQL region diagnostic

on:
  push:
    branches: [hieusro-phuonghoang90-client]
    paths:
      - '.github/workflows/phuonghoang90-gateway-v219-handshake.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mysql-region-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOSRO_COMMIT: 7507c9210da1fb44b3c221f8e30568e26fba68dc
      RUN1_ID: '38905510919'
      RUN1_JOB_ID: '116987950663'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-mysql-client git curl

      - name: Checkout exact go-sro DB scripts
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-mysql-region-diag"
          git clone https://github.com/ferdoran/go-sro.git "$ROOT/go-sro"
          cd "$ROOT/go-sro"
          git checkout "$GOSRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$GOSRO_COMMIT"

          INITDIR="$ROOT/mysql-init"
          mkdir -p "$INITDIR"
          cp -a db/. "$INITDIR/"

          set +x
          SRO_DB_PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "::add-mask::$SRO_DB_PASSWORD"
          export SRO_DB_PASSWORD
          set -x

          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ph90-mysql-region-diag/mysql-init'
          pw = os.environ['SRO_DB_PASSWORD'].replace("'", "''")
          (root / '00-create-sro-user.sql').write_text(
              "CREATE USER IF NOT EXISTS 'sro'@'%' IDENTIFIED BY '" + pw + "';\n",
              encoding='utf-8',
          )
          PY

          {
            echo '=== INIT FILES (sorted) ==='
            find "$INITDIR" -maxdepth 1 -type f -printf '%f\n' | sort
            echo '=== INIT SQL SHA256 ==='
            find "$INITDIR" -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum
          } | tee "$ROOT/init-files.txt"

      - name: Start isolated MySQL and wait for init
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-mysql-region-diag"
          INITDIR="$ROOT/mysql-init"

          docker rm -f ph90-mysql-region-diag >/dev/null 2>&1 || true
          docker run -d --name ph90-mysql-region-diag \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_ROOT_HOST=% \
            -p 127.0.0.1:33306:3306 \
            -v "$INITDIR:/docker-entrypoint-initdb.d:ro" \
            mysql:8.0 --default-authentication-plugin=mysql_native_password

          READY=0
          for i in $(seq 1 120); do
            if docker exec ph90-mysql-region-diag mysql -uroot -Nse 'SELECT COUNT(*) FROM SRO_ACCOUNT.SHARD' >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = 1
          sleep 2

          docker logs ph90-mysql-region-diag > "$ROOT/mysql-init-current.log" 2>&1
          echo 'MYSQL_INIT_READY=1'

      - name: Read-only schema diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-mysql-region-diag"

          {
            echo '=== (1) lower_case_table_names ==='
            docker exec ph90-mysql-region-diag mysql -uroot -e "SHOW VARIABLES LIKE 'lower_case_table_names';"

            echo '=== (2a) SHOW TABLES FROM SRO_SHARD (FULL) ==='
            docker exec ph90-mysql-region-diag mysql -uroot -e "SHOW TABLES FROM SRO_SHARD;"

            echo '=== (2b) SHOW TABLES FROM SRO_SHARD LIKE %REGION% ==='
            docker exec ph90-mysql-region-diag mysql -uroot -e "SHOW TABLES FROM SRO_SHARD LIKE '%REGION%';"

            echo '=== (3) SHOW CREATE TABLE SRO_SHARD.CHAR ==='
            docker exec ph90-mysql-region-diag mysql -uroot -e "SHOW CREATE TABLE SRO_SHARD.CHAR\G"

            echo '=== FK_REGION metadata from information_schema ==='
            docker exec ph90-mysql-region-diag mysql -uroot -e "SELECT CONSTRAINT_NAME,TABLE_SCHEMA,TABLE_NAME,COLUMN_NAME,REFERENCED_TABLE_SCHEMA,REFERENCED_TABLE_NAME,REFERENCED_COLUMN_NAME FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='SRO_SHARD' AND TABLE_NAME='CHAR' AND CONSTRAINT_NAME='FK_REGION';"
          } | tee "$ROOT/schema-diagnostic.txt"

          REGION_TABLE="$(docker exec ph90-mysql-region-diag mysql -uroot -Nse "SELECT REFERENCED_TABLE_NAME FROM information_schema.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA='SRO_SHARD' AND TABLE_NAME='CHAR' AND CONSTRAINT_NAME='FK_REGION' LIMIT 1;")"
          test -n "$REGION_TABLE"
          REGION_ROWS="$(docker exec ph90-mysql-region-diag mysql -uroot -Nse "SELECT COUNT(*) FROM SRO_SHARD.\`$REGION_TABLE\`;" )"

          {
            echo "ACTUAL_REGION_TABLE=$REGION_TABLE"
            echo "ACTUAL_REGION_ROW_COUNT=$REGION_ROWS"
            echo '=== actual region table sample (first 10 rows) ==='
            docker exec ph90-mysql-region-diag mysql -uroot -e "SELECT * FROM SRO_SHARD.\`$REGION_TABLE\` LIMIT 10;"
          } | tee "$ROOT/region-table-result.txt"

      - name: Inspect current MySQL init log
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-mysql-region-diag"
          LOG="$ROOT/mysql-init-current.log"

          {
            echo '=== CURRENT RUN: entrypoint SQL execution lines ==='
            grep -Ei 'docker-entrypoint-initdb.d|running /docker-entrypoint-initdb.d|create_sro|grant_user|\.sql' "$LOG" || true
            echo '=== CURRENT RUN: error/warning/skip scan ==='
            grep -Ein 'error|failed|failure|skip|ignored|warning' "$LOG" || true
            echo '=== CURRENT RUN: create_sro_shard mentions ==='
            grep -Ein 'create_sro_shard' "$LOG" || true
            echo '=== CURRENT RUN: final 120 init-log lines ==='
            tail -n 120 "$LOG"
          } | tee "$ROOT/mysql-init-current-summary.txt"

      - name: Compare MySQL init visibility with run 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-mysql-region-diag"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$RUN1_JOB_ID/logs"

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$API" -o "$ROOT/run1-job.log"

          {
            echo "RUN1_ID=$RUN1_ID"
            echo "RUN1_JOB_ID=$RUN1_JOB_ID"
            echo '=== RUN #1: MySQL/init-related lines ==='
            grep -Ei 'mysql-init|docker-entrypoint-initdb.d|create_sro_shard|grant_user_permissions|00-create-sro-user|ERROR 14|ERROR 11|mysql:8\.0' "$ROOT/run1-job.log" || true
            echo '=== RUN #1: did workflow capture container entrypoint execution? ==='
            if grep -q 'running /docker-entrypoint-initdb.d' "$ROOT/run1-job.log"; then
              echo 'RUN1_CONTAINER_ENTRYPOINT_LOG_CAPTURED=YES'
            else
              echo 'RUN1_CONTAINER_ENTRYPOINT_LOG_CAPTURED=NO'
            fi
            echo '=== CURRENT RUN: did workflow capture container entrypoint execution? ==='
            if grep -qi 'running /docker-entrypoint-initdb.d' "$ROOT/mysql-init-current.log"; then
              echo 'CURRENT_CONTAINER_ENTRYPOINT_LOG_CAPTURED=YES'
            else
              echo 'CURRENT_CONTAINER_ENTRYPOINT_LOG_CAPTURED=NO'
            fi
          } | tee "$ROOT/run1-comparison.txt"

      - name: Upload read-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHUONGHOANG90-mysql-region-readonly-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ph90-mysql-region-diag/init-files.txt
            ${{ runner.temp }}/ph90-mysql-region-diag/schema-diagnostic.txt
            ${{ runner.temp }}/ph90-mysql-region-diag/region-table-result.txt
            ${{ runner.temp }}/ph90-mysql-region-diag/mysql-init-current.log
            ${{ runner.temp }}/ph90-mysql-region-diag/mysql-init-current-summary.txt
            ${{ runner.temp }}/ph90-mysql-region-diag/run1-comparison.txt
