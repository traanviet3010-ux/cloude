name: TEST PHUONGHOANG90 Gateway + v219 handshake

on:
  push:
    branches: [hieusro-phuonghoang90-client]
    paths:
      - '.github/workflows/phuonghoang90-gateway-v219-handshake.yml'
      - 'ci/ph90-v219-probe.go'
      - 'ci/ph90-skip299-generator.go'
      - 'ci/ph90-apply-test-patches.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handshake:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PH90_FILE_ID: 1BGHeEvfQYFGuTw90QR6bYUXrfH-V-hjo
      PH90_EXPECTED_SIZE: '1792674229'
      PH90_EXPECTED_SHA256: b081c94db008de4d3a7e418a159027b1a75aef8d03e6768efff871f7e5c3e595
      GOSRO_COMMIT: 7507c9210da1fb44b3c221f8e30568e26fba68dc
      CLIENT_VERSION: '219'
      CONTENT_ID: '22'
      TEST_USERNAME: ph90test219
      TEST_CHAR: Ph90Probe

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unrar python3-pip netcat-openbsd default-mysql-client git
          python3 -m pip install --user --break-system-packages gdown bcrypt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: false

      - name: Download exact PHUONGHOANG90 Data.pk2
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          mkdir -p "$ROOT/game"
          cd "$ROOT"
          ~/.local/bin/gdown "$PH90_FILE_ID" -O PHUONGHOANG90.rar
          test "$(stat -c %s PHUONGHOANG90.rar)" = "$PH90_EXPECTED_SIZE"
          SHA="$(sha256sum PHUONGHOANG90.rar | awk '{print $1}')"
          test "$SHA" = "$PH90_EXPECTED_SHA256"
          unrar x -o+ -idq PHUONGHOANG90.rar 'PHUONGHOANG90/Data.pk2' game/
          mv game/PHUONGHOANG90/Data.pk2 game/Data.pk2
          rmdir game/PHUONGHOANG90
          printf 'CLIENT_VERSION=%s\nCONTENT_ID=%s\nPH90_ARCHIVE_SHA256=%s\n' "$CLIENT_VERSION" "$CONTENT_ID" "$SHA" | tee provenance.txt

      - name: Build TEST Agent skip299 and Gateway
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          git clone https://github.com/ferdoran/go-sro.git "$ROOT/go-sro"
          cd "$ROOT/go-sro"
          git checkout "$GOSRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$GOSRO_COMMIT"
          go get github.com/go-sql-driver/mysql@v1.8.1
          go mod tidy

          GEN="$ROOT/generator"
          mkdir -p "$GEN"
          cp "$GITHUB_WORKSPACE/ci/ph90-skip299-generator.go" "$GEN/main.go"
          cat > "$GEN/go.mod" <<EOF
          module skipgen
          go 1.22
          require github.com/ferdoran/go-sro v0.0.0
          replace github.com/ferdoran/go-sro => $ROOT/go-sro
          EOF
          cd "$GEN"
          go mod tidy
          CGO_ENABLED=0 go run . "$ROOT/game/Data.pk2" "$ROOT/go-sro/agent-server/navmeshv2/ph90_skip_missing_generated.go" "$ROOT" | tee "$ROOT/skip299-summary.txt"
          test "$(wc -l < "$ROOT/skip299-paths.tsv")" = 299

          python3 "$GITHUB_WORKSPACE/ci/ph90-apply-test-patches.py" "$ROOT/go-sro"
          cd "$ROOT/go-sro"
          CGO_ENABLED=0 GOOS=linux go build -o "$ROOT/agent-server" agent-server/server.go
          CGO_ENABLED=0 GOOS=linux go build -o "$ROOT/gateway-server" gateway-server/server.go
          test -s "$ROOT/agent-server"
          test -s "$ROOT/gateway-server"

      - name: Start isolated MySQL and seed TEST login
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          INITDIR="$ROOT/mysql-init"
          mkdir -p "$INITDIR"
          cp -a "$ROOT/go-sro/db/." "$INITDIR/"

          set +x
          SRO_DB_PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          TEST_LOGIN_PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(18))
          PY
          )"
          echo "::add-mask::$SRO_DB_PASSWORD"
          echo "::add-mask::$TEST_LOGIN_PASSWORD"
          printf 'SRO_DB_PASSWORD=%s\nTEST_LOGIN_PASSWORD=%s\n' "$SRO_DB_PASSWORD" "$TEST_LOGIN_PASSWORD" >> "$GITHUB_ENV"
          export SRO_DB_PASSWORD TEST_LOGIN_PASSWORD
          set -x

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'ph90-gw-v219/mysql-init/00-create-sro-user.sql'
          pw = os.environ['SRO_DB_PASSWORD'].replace("'", "''")
          p.write_text("CREATE USER IF NOT EXISTS 'sro'@'%' IDENTIFIED BY '" + pw + "';\n")
          PY

          docker rm -f ph90-gw-v219-mysql >/dev/null 2>&1 || true
          docker run -d --name ph90-gw-v219-mysql \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_ROOT_HOST=% \
            -p 127.0.0.1:33306:3306 \
            -v "$INITDIR:/docker-entrypoint-initdb.d:ro" \
            mysql:8.0 --default-authentication-plugin=mysql_native_password

          READY=0
          for i in $(seq 1 90); do
            if docker exec ph90-gw-v219-mysql mysql -uroot -Nse 'SELECT COUNT(*) FROM SRO_ACCOUNT.SHARD' >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1
          docker exec ph90-gw-v219-mysql mysql -uroot -e "UPDATE SRO_ACCOUNT.SHARD SET CONTENT_ID=22, NAME='HieuSRO-v219-TEST', STATUS=1 WHERE ID=1;"

          HASH="$(python3 - <<'PY'
          import bcrypt, os
          print(bcrypt.hashpw(os.environ['TEST_LOGIN_PASSWORD'].encode(), bcrypt.gensalt(rounds=12)).decode())
          PY
          )"
          docker exec ph90-gw-v219-mysql mysql -uroot -e "DELETE FROM SRO_ACCOUNT.USER WHERE USERNAME='$TEST_USERNAME'; INSERT INTO SRO_ACCOUNT.USER(USERNAME,PASSWORD,MAIL,STATUS,IS_GM) VALUES('$TEST_USERNAME','$HASH','test@example.invalid',1,0); SET @uid=LAST_INSERT_ID(); DELETE FROM SRO_SHARD.CHAR WHERE CHAR_NAME='$TEST_CHAR'; INSERT INTO SRO_SHARD.CHAR(REF_OBJ_ID,FK_USER,FK_SHARD,CHAR_NAME,CHAR_SCALE,CURRENT_LEVEL,EXP,SKILL_EXP,STRENGTH,INTELLECT,STAT_POINTS,HP,MP,DELETING,POS_X,POS_Y,POS_Z,FK_REGION,SKILL_POINTS,MAX_LEVEL) VALUES(1907,@uid,1,'$TEST_CHAR',100,1,0,0,20,20,0,200,200,0,950,40,1091,0x62A8,0,1);"
          docker exec ph90-gw-v219-mysql mysql -uroot -Nse "SELECT ID,USERNAME FROM SRO_ACCOUNT.USER WHERE USERNAME='$TEST_USERNAME'; SELECT ID,REF_OBJ_ID,CHAR_NAME,FK_REGION FROM SRO_SHARD.CHAR WHERE CHAR_NAME='$TEST_CHAR';" | tee "$ROOT/seed.txt"

      - name: Start Agent skip299 then Gateway TEST
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          env DB_ACCOUNT_HOST=127.0.0.1 DB_ACCOUNT_PORT=33306 DB_ACCOUNT_USER=sro DB_ACCOUNT_PW="$SRO_DB_PASSWORD" DB_ACCOUNT_DATABASE=SRO_ACCOUNT \
              DB_SHARD_HOST=127.0.0.1 DB_SHARD_PORT=33306 DB_SHARD_USER=sro DB_SHARD_PW="$SRO_DB_PASSWORD" DB_SHARD_DATABASE=SRO_SHARD \
              AGENT_HOST=127.0.0.1 AGENT_PORT=15882 AGENT_DATA_PATH="$ROOT/game/Data.pk2" AGENT_PRELINKED_NAVDATA_FILE="$ROOT/no-prelinked-nav.gob" LOG_LEVEL=debug \
              "$ROOT/agent-server" >"$ROOT/agent.log" 2>&1 &
          echo $! > "$ROOT/agent.pid"
          date +%s > "$ROOT/agent-start-epoch.txt"

          for i in $(seq 1 240); do
            nc -z 127.0.0.1 15882 && break
            kill -0 "$(cat "$ROOT/agent.pid")"
            sleep 2
          done
          nc -z 127.0.0.1 15882

          env DB_ACCOUNT_HOST=127.0.0.1 DB_ACCOUNT_PORT=33306 DB_ACCOUNT_USER=sro DB_ACCOUNT_PW="$SRO_DB_PASSWORD" DB_ACCOUNT_DATABASE=SRO_ACCOUNT \
              DB_SHARD_HOST=127.0.0.1 DB_SHARD_PORT=33306 DB_SHARD_USER=sro DB_SHARD_PW="$SRO_DB_PASSWORD" DB_SHARD_DATABASE=SRO_SHARD \
              AGENT_HOST=127.0.0.1 AGENT_PUBLIC_IP=127.0.0.1 AGENT_PORT=15882 GATEWAY_HOST=127.0.0.1 GATEWAY_PORT=15779 LOG_LEVEL=debug \
              "$ROOT/gateway-server" >"$ROOT/gateway.log" 2>&1 &
          echo $! > "$ROOT/gateway.pid"

          for i in $(seq 1 60); do
            nc -z 127.0.0.1 15779 && break
            kill -0 "$(cat "$ROOT/gateway.pid")"
            sleep 1
          done
          nc -z 127.0.0.1 15779
          sleep 2
          if grep -q 'Connection established' "$ROOT/gateway.log"; then
            echo 'GATEWAY_BACKEND_AGENT_CONNECTION=PASS' | tee "$ROOT/gateway-agent.txt"
          else
            echo 'GATEWAY_BACKEND_AGENT_CONNECTION=NOT_CONFIRMED' | tee "$ROOT/gateway-agent.txt"
          fi

      - name: Probe handshake CLIENT_VERSION 219 CONTENT_ID 22
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          PROBE="$ROOT/probe"
          mkdir -p "$PROBE"
          cp "$GITHUB_WORKSPACE/ci/ph90-v219-probe.go" "$PROBE/main.go"
          cat > "$PROBE/go.mod" <<EOF
          module v219probe
          go 1.22
          require github.com/ferdoran/go-sro v0.0.0
          replace github.com/ferdoran/go-sro => $ROOT/go-sro
          EOF
          cd "$PROBE"
          go mod tidy
          set +e
          go run . "$TEST_USERNAME" "$TEST_LOGIN_PASSWORD" "$TEST_CHAR" "$CLIENT_VERSION" "$CONTENT_ID" 2>&1 | tee "$ROOT/probe.log"
          RC=${PIPESTATUS[0]}
          set -e
          grep -E 'CLIENT_VERSION|CONTENT_ID|STEP_|WARN_|panic:|timeout waiting' "$ROOT/probe.log" | tee "$ROOT/probe-summary.txt" || true
          if grep -q 'login token request' "$ROOT/agent.log"; then
            echo 'GATEWAY_TO_AGENT_LOGIN_TOKEN=PASS' | tee -a "$ROOT/probe-summary.txt"
          else
            echo 'GATEWAY_TO_AGENT_LOGIN_TOKEN=NOT_CONFIRMED' | tee -a "$ROOT/probe-summary.txt"
          fi
          exit "$RC"

      - name: Keep Agent alive for at least 5 minutes
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          test -f "$ROOT/agent.pid"
          test -f "$ROOT/agent-start-epoch.txt"
          START="$(cat "$ROOT/agent-start-epoch.txt")"
          while [ $(( $(date +%s) - START )) -lt 300 ]; do
            if ! kill -0 "$(cat "$ROOT/agent.pid")" 2>/dev/null; then
              echo 'AGENT_CRASHED_BEFORE_5_MIN=1' | tee "$ROOT/agent-5min.txt"
              exit 1
            fi
            sleep 5
          done
          if kill -0 "$(cat "$ROOT/agent.pid")" 2>/dev/null && nc -z 127.0.0.1 15882; then
            echo 'AGENT_ALIVE_AFTER_5_MIN=1' | tee "$ROOT/agent-5min.txt"
          else
            echo 'AGENT_ALIVE_AFTER_5_MIN=0' | tee "$ROOT/agent-5min.txt"
            exit 1
          fi

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/ph90-gw-v219"
          {
            echo '=== gateway-agent ==='; cat "$ROOT/gateway-agent.txt" 2>/dev/null || true
            echo '=== probe ==='; cat "$ROOT/probe-summary.txt" 2>/dev/null || true
            echo '=== agent 5min ==='; cat "$ROOT/agent-5min.txt" 2>/dev/null || true
            echo '=== gateway tail ==='; tail -n 160 "$ROOT/gateway.log" 2>/dev/null || true
            echo '=== agent tail ==='; tail -n 240 "$ROOT/agent.log" 2>/dev/null || true
          } | tee "$ROOT/final-diagnostics.txt"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHUONGHOANG90-gateway-v219-handshake-report
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ph90-gw-v219/provenance.txt
            ${{ runner.temp }}/ph90-gw-v219/skip299-summary.txt
            ${{ runner.temp }}/ph90-gw-v219/skip299-paths.tsv
            ${{ runner.temp }}/ph90-gw-v219/seed.txt
            ${{ runner.temp }}/ph90-gw-v219/gateway-agent.txt
            ${{ runner.temp }}/ph90-gw-v219/probe.log
            ${{ runner.temp }}/ph90-gw-v219/probe-summary.txt
            ${{ runner.temp }}/ph90-gw-v219/agent-5min.txt
            ${{ runner.temp }}/ph90-gw-v219/gateway.log
            ${{ runner.temp }}/ph90-gw-v219/agent.log
            ${{ runner.temp }}/ph90-gw-v219/final-diagnostics.txt
