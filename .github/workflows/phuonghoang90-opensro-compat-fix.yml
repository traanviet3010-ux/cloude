name: Continue PHUONGHOANG90 v219 OpenSRO compatibility

on:
  push:
    branches: [hieusro-phuonghoang90-client]
    paths:
      - '.github/workflows/phuonghoang90-opensro-compat-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DRIVE_FILE_ID: 1BGHeEvfQYFGuTw90QR6bYUXrfH-V-hjo
      EXPECTED_SIZE: '1792674229'
      EXPECTED_SHA256: b081c94db008de4d3a7e418a159027b1a75aef8d03e6768efff871f7e5c3e595
      OPEN_SRO_COMMIT: 4f6919d6900d169b89e75647e56c99ca8ebd5cfb
      SRO_BUILD_JOBS: '2'

    steps:
      - name: Install toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unrar ffmpeg git build-essential python3-pip fonts-liberation2 ca-certificates
          python3 -m pip install --user --break-system-packages gdown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Download and extract exact v219 client inputs
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219fix"
          mkdir -p "$ROOT/game"
          cd "$ROOT"
          ~/.local/bin/gdown "$DRIVE_FILE_ID" -O PHUONGHOANG90.rar
          test "$(stat -c %s PHUONGHOANG90.rar)" = "$EXPECTED_SIZE"
          test "$(sha256sum PHUONGHOANG90.rar | awk '{print $1}')" = "$EXPECTED_SHA256"
          unrar x -o+ -idq PHUONGHOANG90.rar \
            'PHUONGHOANG90/*.pk2' \
            'PHUONGHOANG90/sro_client.exe' \
            game/
          GAME="$ROOT/game/PHUONGHOANG90"
          for f in Media.pk2 Data.pk2 Map.pk2 Particles.pk2 Music.pk2 sro_client.exe; do test -s "$GAME/$f"; done
          ln -sf sro_client.exe "$GAME/SRO_Client.exe"

      - name: Checkout and patch pinned OpenSRO only for TEST compatibility
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219fix"
          git clone --filter=blob:none https://github.com/opensro-dev/opensro.git "$ROOT/opensro"
          cd "$ROOT/opensro"
          git checkout "$OPEN_SRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$OPEN_SRO_COMMIT"
          corepack enable
          corepack pnpm install --frozen-lockfile
          python3 -m pip install --user --break-system-packages -r requirements-build.txt
          python3 - <<'PY'
          from pathlib import Path

          # Keep v219 wording when a reviewed v1.150 correction no longer matches.
          p = Path('scripts/build/shared/englishCorrections.mjs')
          s = p.read_text()
          old = 'if ( english !== correction.before ) throw new Error( `Stale English correction ${fileName}:${key}` );'
          new = 'if ( english !== correction.before ) return english; // v219 TEST: keep changed retail wording'
          if old not in s:
              raise SystemExit('englishCorrections guard not found')
          p.write_text(s.replace(old, new, 1))

          # The v219 archive contains 22 nonstandard DDJ files. Record them, but
          # allow the requested region build to prove whether it actually needs them.
          p = Path('scripts/convert_images.py')
          s = p.read_text()
          old = '''        print(f"Failures written to {failure_path}", file=sys.stderr)\n        return 1'''
          new = '''        print(f"Failures written to {failure_path}; v219 TEST continues so requested-region dependencies can be validated", file=sys.stderr)\n        return 0'''
          if old not in s:
              raise SystemExit('convert_images failure return not found')
          p.write_text(s.replace(old, new, 1))

          # OpenSRO discovers every mapinfo bit before applying --region. For a
          # targeted compatibility build, validate exactly the requested region
          # instead, while retaining all normal .m/.t/.o2/.nvm checks for it.
          p = Path('scripts/build/world/buildOutdoorWorldRegionResources.mjs')
          s = p.read_text()
          old_loop = '\tfor ( const regionId of availability.regionIds ) {'
          new_loop = '''\tconst requested = options.regionIds?.length ? new Set( options.regionIds.map( normalizeRegionId ) ) : undefined;\n\tconst candidateRegionIds = requested ? availability.regionIds.filter( regionId => requested.has( normalizeRegionId( regionId ) ) ) : availability.regionIds;\n\tfor ( const regionId of candidateRegionIds ) {'''
          if old_loop not in s:
              raise SystemExit('outdoor discovery loop not found')
          s = s.replace(old_loop, new_loop, 1)
          old_call = 'const sectors = options.sectors ?? (await discoverOutdoorWorldSectors( { extractedRoot: sourceExtractedRoot } ));'
          new_call = 'const sectors = options.sectors ?? (await discoverOutdoorWorldSectors( { extractedRoot: sourceExtractedRoot, regionIds: options.regionIds } ));'
          if old_call not in s:
              raise SystemExit('outdoor discovery call not found')
          p.write_text(s.replace(old_call, new_call, 1))
          PY

      - name: Run requested-region compatibility build
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/ph219fix"
          SRC="$ROOT/opensro"
          export SRO_GAME_ROOT="$ROOT/game/PHUONGHOANG90"
          export SRO_FONT_ARIAL=/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf
          export SRO_FONT_ARIAL_BOLD=/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf
          cd "$SRC"
          : > "$ROOT/status.env"
          set +e

          corepack pnpm assets prepare 2>&1 | tee "$ROOT/01-prepare.log"
          PREPARE=${PIPESTATUS[0]}; echo "PREPARE=$PREPARE" >> "$ROOT/status.env"
          corepack pnpm assets doctor 2>&1 | tee "$ROOT/02-doctor.log"
          DOCTOR=${PIPESTATUS[0]}; echo "DOCTOR=$DOCTOR" >> "$ROOT/status.env"

          corepack pnpm assets build world-outdoor -- --region=0x61a8 --force --jobs=1 2>&1 | tee "$ROOT/03-world-61a8.log"
          WORLD=${PIPESTATUS[0]}; echo "WORLD_61A8=$WORLD" >> "$ROOT/status.env"
          FAILS="$SRC/.generated/intermediate/image-conversion-failures.txt"
          if [ -f "$FAILS" ]; then cp "$FAILS" "$ROOT/image-conversion-failures.txt"; fi

          set -e
          cat "$ROOT/status.env" | tee "$ROOT/compat-fix-report.txt"
          if [ -f "$SRC/public/assets/world/outdoor/region-61a8.json" ]; then
            cp "$SRC/public/assets/world/outdoor/region-61a8.json" "$ROOT/region-61a8.json"
            sha256sum "$ROOT/region-61a8.json" | tee "$ROOT/region-61a8.sha256"
          fi
          find "$SRC/public/assets/world" -maxdepth 4 -type f -printf '%P\t%s bytes\n' 2>/dev/null | sort > "$ROOT/world-files.txt" || true
          exit 0

      - name: Upload requested-region report
        uses: actions/upload-artifact@v4
        with:
          name: PHUONGHOANG90-v219-region-61a8
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ph219fix/status.env
            ${{ runner.temp }}/ph219fix/compat-fix-report.txt
            ${{ runner.temp }}/ph219fix/image-conversion-failures.txt
            ${{ runner.temp }}/ph219fix/01-prepare.log
            ${{ runner.temp }}/ph219fix/02-doctor.log
            ${{ runner.temp }}/ph219fix/03-world-61a8.log
            ${{ runner.temp }}/ph219fix/region-61a8.json
            ${{ runner.temp }}/ph219fix/region-61a8.sha256
            ${{ runner.temp }}/ph219fix/world-files.txt
