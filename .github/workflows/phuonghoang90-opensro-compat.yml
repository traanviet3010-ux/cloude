name: Build PHUONGHOANG90 v219 server probe

on:
  push:
    branches: [hieusro-phuonghoang90-client]
    paths:
      - '.github/workflows/phuonghoang90-opensro-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DRIVE_FILE_ID: 1BGHeEvfQYFGuTw90QR6bYUXrfH-V-hjo
      EXPECTED_SIZE: '1792674229'
      EXPECTED_SHA256: b081c94db008de4d3a7e418a159027b1a75aef8d03e6768efff871f7e5c3e595
      OPEN_SRO_COMMIT: 4f6919d6900d169b89e75647e56c99ca8ebd5cfb
      SRO_BUILD_JOBS: '2'

    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unrar ffmpeg git build-essential python3-pip fonts-liberation2 ca-certificates
          python3 -m pip install --user --break-system-packages gdown

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Download exact PHUONGHOANG90 archive only
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          mkdir -p "$ROOT"
          cd "$ROOT"
          ~/.local/bin/gdown "$DRIVE_FILE_ID" -O PHUONGHOANG90.rar
          test "$(stat -c %s PHUONGHOANG90.rar)" = "$EXPECTED_SIZE"
          ACTUAL_SHA="$(sha256sum PHUONGHOANG90.rar | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA256"
          printf 'ARCHIVE_SIZE=%s\nARCHIVE_SHA256=%s\n' "$EXPECTED_SIZE" "$ACTUAL_SHA" | tee provenance.txt

      - name: Extract server-data inputs from exact archive
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          mkdir -p "$ROOT/game"
          cd "$ROOT"
          unrar x -o+ -idq PHUONGHOANG90.rar \
            'PHUONGHOANG90/*.pk2' \
            'PHUONGHOANG90/sro_client.exe' \
            game/
          GAME="$ROOT/game/PHUONGHOANG90"
          for f in Media.pk2 Data.pk2 Map.pk2 Particles.pk2 Music.pk2 sro_client.exe; do test -s "$GAME/$f"; done
          ln -sf sro_client.exe "$GAME/SRO_Client.exe"
          sha256sum "$GAME"/*.pk2 "$GAME/sro_client.exe" | tee "$ROOT/client-inputs.sha256"

      - name: Checkout pinned OpenSRO
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          git clone --filter=blob:none https://github.com/opensro-dev/opensro.git "$ROOT/opensro"
          cd "$ROOT/opensro"
          git checkout "$OPEN_SRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$OPEN_SRO_COMMIT"
          corepack enable
          corepack pnpm install --frozen-lockfile
          python3 -m pip install --user --break-system-packages -r requirements-build.txt

      - name: Apply v219 build-only compatibility shim
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/ph219/opensro"
          cd "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build/shared/englishCorrections.mjs')
          s = p.read_text()
          old = 'if ( english !== correction.before ) throw new Error( `Stale English correction ${fileName}:${key}` );'
          new = 'if ( english !== correction.before ) { console.warn( `[v219-compat] keeping authored text for ${fileName}:${key}` ); return english; }'
          if old not in s:
              raise SystemExit('expected strict English correction guard not found')
          p.write_text(s.replace(old, new))
          PY
          git diff -- scripts/build/shared/englishCorrections.mjs | tee "$RUNNER_TEMP/ph219/v219-build-shim.diff"

      - name: Prepare exact v219 PK2 data
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          SRC="$ROOT/opensro"
          export SRO_GAME_ROOT="$ROOT/game/PHUONGHOANG90"
          export SRO_FONT_ARIAL=/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf
          export SRO_FONT_ARIAL_BOLD=/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf
          cd "$SRC"
          corepack pnpm assets prepare 2>&1 | tee "$ROOT/01-prepare.log"
          corepack pnpm assets doctor 2>&1 | tee "$ROOT/02-doctor.log"

      - name: Build server game data from v219
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          SRC="$ROOT/opensro"
          export SRO_GAME_ROOT="$ROOT/game/PHUONGHOANG90"
          export SRO_FONT_ARIAL=/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf
          export SRO_FONT_ARIAL_BOLD=/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf
          cd "$SRC"
          corepack pnpm task build server-game-data 2>&1 | tee "$ROOT/03-server-game-data.log"
          SROGZ="$(find "$SRC/apps/server/.generated/game-data" -name server.srogz -type f -print -quit)"
          test -n "$SROGZ"
          test -s "$SROGZ"
          cp "$SROGZ" "$ROOT/server-v219.srogz"
          sha256sum "$ROOT/server-v219.srogz" | tee "$ROOT/server-v219.srogz.sha256"

      - name: Build Linux server binaries
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          SRC="$ROOT/opensro"
          cd "$SRC/apps/server"
          CGO_ENABLED=0 GOOS=linux go build -o "$ROOT/sro-agent-v219" ./cmd/services/sro-agent 2>&1 | tee "$ROOT/04-build-agent.log"
          CGO_ENABLED=0 GOOS=linux go build -o "$ROOT/sro-gameworld-v219" ./cmd/services/sro-gameworld 2>&1 | tee "$ROOT/05-build-gameworld.log"
          test -s "$ROOT/sro-agent-v219"
          test -s "$ROOT/sro-gameworld-v219"
          file "$ROOT/sro-agent-v219" "$ROOT/sro-gameworld-v219" | tee "$ROOT/binaries.txt"
          sha256sum "$ROOT/sro-agent-v219" "$ROOT/sro-gameworld-v219" | tee "$ROOT/binaries.sha256"

      - name: Write build report
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/ph219"
          {
            echo PHUONGHOANG90_V219_SERVER_BUILD_OK=1
            echo CLIENT_VERSION=219
            echo CONTENT_ID=22
            echo EXPECTED_GATEWAY_PORT=15779
            echo OPEN_SRO_COMMIT="$OPEN_SRO_COMMIT"
            cat "$ROOT/provenance.txt"
            cat "$ROOT/server-v219.srogz.sha256"
            cat "$ROOT/binaries.txt"
            cat "$ROOT/binaries.sha256"
          } | tee "$ROOT/build-report.txt"

      - name: Upload v219 server build
        uses: actions/upload-artifact@v4
        with:
          name: PHUONGHOANG90-v219-server-build
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ph219/build-report.txt
            ${{ runner.temp }}/ph219/provenance.txt
            ${{ runner.temp }}/ph219/v219-build-shim.diff
            ${{ runner.temp }}/ph219/01-prepare.log
            ${{ runner.temp }}/ph219/02-doctor.log
            ${{ runner.temp }}/ph219/03-server-game-data.log
            ${{ runner.temp }}/ph219/04-build-agent.log
            ${{ runner.temp }}/ph219/05-build-gameworld.log
            ${{ runner.temp }}/ph219/server-v219.srogz
            ${{ runner.temp }}/ph219/server-v219.srogz.sha256
            ${{ runner.temp }}/ph219/sro-agent-v219
            ${{ runner.temp }}/ph219/sro-gameworld-v219
            ${{ runner.temp }}/ph219/binaries.txt
            ${{ runner.temp }}/ph219/binaries.sha256
