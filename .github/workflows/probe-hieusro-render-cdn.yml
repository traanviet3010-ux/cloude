name: Probe deployed HieuSRO Render CDN byte ranges

on:
  push:
    branches:
      - hieusro-render-asset-cdn-test-20261020
    paths:
      - '.github/workflows/probe-hieusro-render-cdn.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'traanviet3010-ux/cloude'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: GET public Render sample and byte ranges (read only)
        env:
          CDN_URL: https://hieusro-assets-cdn-test-20261020.onrender.com
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          root=os.environ['CDN_URL']
          def get(url, headers=None):
              req=urllib.request.Request(url, headers={**{'Accept-Encoding':'identity'}, **(headers or {})})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  return resp.status, {k.lower():v for k,v in resp.headers.items()}, resp.read()
          status,_,body=get(root+'/mirror-status.json')
          assert status==200, f'status JSON HTTP {status}'
          data=json.loads(body)
          print('MIRROR_PHASE='+data['phase'])
          assert data['phase']=='sample-only' and data['ready_for_client'] is False
          p=data['sample_path']
          assert re.fullmatch(r'/assets/packs/[A-Za-z0-9_./-]+\.bin',p)
          s,h,b=get(root+p,{'Range':'bytes=0-15'})
          print('RANGE_STATUS='+str(s))
          print('RANGE_CONTENT_RANGE='+str(h.get('content-range')))
          print('RANGE_CONTENT_ENCODING='+str(h.get('content-encoding')))
          print('RANGE_BODY_LENGTH='+str(len(b)))
          if s!=206: raise AssertionError('Render CDN does not support required 206 byte ranges')
          assert h.get('content-range')==f"bytes 0-15/{data['sample_bytes']}"
          assert len(b)==16 and b[:8]==b'SROPACK2',repr(b)
          assert h.get('content-encoding') in (None,'identity'), 'Unexpected encoding'
          print('RANGE_206_OK=1')
          try:
              missing,_,_=get(root+'/assets/packs/manifest.json')
              raise AssertionError(f'Partial mirror must NOT publish manifest: got {missing}')
          except urllib.error.HTTPError as exc:
              assert exc.code==404,f'Unexpected manifest status {exc.code}'
          print('PARTIAL_MANIFEST_HIDDEN=1')
          PY
