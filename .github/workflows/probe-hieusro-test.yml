name: Probe HieuSRO TEST shard

on:
  push:
    branches: [hieusro-digitalocean]
    paths:
      - '.github/workflows/probe-hieusro-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-test-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for LIVE + TEST catalogue
        run: |
          set -euo pipefail
          URL='https://play.143-198-217-75.sslip.io/api/title/servers'
          for attempt in $(seq 1 60); do
            echo "Probe $attempt/60 at $(date -u +%FT%TZ)"
            if curl -kfsS --max-time 10 -H 'X-OpenSRO-Protocol: 6' "$URL" -o /tmp/servers.json; then
              cat /tmp/servers.json
              if python - <<'PY'
          import json
          rows = json.load(open('/tmp/servers.json'))
          by_id = {row.get('id'): row for row in rows if isinstance(row, dict)}
          live = by_id.get('global-official')
          test = by_id.get('hieusro-test')
          assert live and live.get('name') == 'HieuSRO'
          assert test and test.get('name') == 'HieuSRO TEST'
          print('LIVE + TEST catalogue confirmed')
          PY
              then
                break
              fi
            fi
            if [ "$attempt" = 60 ]; then
              echo 'Timed out waiting for HieuSRO TEST catalogue' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify TEST transport route
        run: |
          curl -kfsS --max-time 15 \
            https://play.143-198-217-75.sslip.io/shards/hieusro-test/transport/readyz
          echo
          echo 'HieuSRO TEST transport route is ready.'
