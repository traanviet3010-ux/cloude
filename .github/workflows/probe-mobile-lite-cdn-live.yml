name: Verify Mobile Lite uses Render CDN asset packs

on:
  push:
    branches:
      - hieusro-mobile-stability-v1-20261020
    paths:
      - '.github/workflows/probe-mobile-lite-cdn-live.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'traanviet3010-ux/cloude'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check Mobile Lite shell, manifest pin and pack Range 206
        env:
          MOBILE: https://hieusro-mobile-lite-20261020.onrender.com
          CDN: https://hieusro-assets-cdn-test-20261020.onrender.com
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          mobile=os.environ['MOBILE']; cdn=os.environ['CDN']
          digest='fb641484109f7c4bbeaabf516a0796db76c78b36094e5ff28e9271d16b29fbd1'
          def fetch(base,path,headers=None):
              hdr={'Accept-Encoding':'identity',**(headers or {})}
              req=urllib.request.Request(base+path,headers=hdr)
              with urllib.request.urlopen(req,timeout=70) as response:
                  return response.status,{k.lower():v for k,v in response.headers.items()},response.read()
          ready=False
          for attempt in range(24):
              try:
                  status,_,health=fetch(mobile,'/__mobile/health')
                  if status!=200 or json.loads(health).get('status')!='ready':
                      raise AssertionError('Mobile Lite health not ready')
                  status,headers,raw=fetch(mobile,'/assets/packs/manifest.json')
                  if status==200 and headers.get('x-hieusro-asset-source')=='render-cdn-test':
                      ready=True
                      break
              except Exception as error:
                  print('WAITING_FOR_MOBILE_DEPLOY',attempt+1,type(error).__name__,flush=True)
              time.sleep(5)
          assert ready, 'New CDN route not live on Mobile Lite'
          print('MOBILE_CDN_ROUTE_OK=1')
          assert hashlib.sha256(raw).hexdigest()==digest, 'Mobile manifest SHA drifted'
          obj=json.loads(raw)
          packs=[pack for group in obj['groups'] for pack in group['packs']]
          assert len(packs)==213 and len(obj['groups'])==17 and len(obj['assets'])==36843
          print('MOBILE_MANIFEST_213_OK=1')
          target=max(packs,key=lambda pack:pack['bytes'])
          for start,end in [(0,15),(max(0,target['bytes']//2),max(0,target['bytes']//2)+1023)]:
              start,end=start,min(end,target['bytes']-1)
              code,h,blob=fetch(mobile,target['path'],{'Range':f'bytes={start}-{end}'})
              code2,h2,blob2=fetch(cdn,target['path'],{'Range':f'bytes={start}-{end}'})
              assert code==code2==206,(code,code2)
              assert h.get('x-hieusro-asset-source')=='render-cdn-test'
              assert h.get('content-range')==h2.get('content-range')==f"bytes {start}-{end}/{target['bytes']}"
              assert blob==blob2 and len(blob)==end-start+1
              assert h.get('content-encoding') in (None,'identity')
              if start==0: assert blob[:8]==b'SROPACK2'
              print('MOBILE_PACK_RANGE_206_OK',start,end,flush=True)
          status,headers,html=fetch(mobile,'/')
          assert status==200 and b'<html' in html.lower(), 'Game shell failed'
          print('MOBILE_GAME_HTML_OK=1')
          print('MOBILE_ASSET_CDN_TEST_READY=1')
          PY
