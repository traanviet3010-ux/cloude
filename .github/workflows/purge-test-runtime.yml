name: Purge HieuSRO TEST runtime residue
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/purge-test-runtime.yml']
permissions:
  contents: read
jobs:
  purge:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 15
    steps:
      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Remove TEST-only state, containers and images
        shell: bash
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 "sudo -n bash -s" <<'REMOTE'
          set -euo pipefail
          echo '=== Stop production game briefly for state cleanup ==='
          docker stop digitalocean-game-1 >/dev/null 2>&1 || true

          echo '=== Delete TEST-only state ==='
          docker run --rm --entrypoint sh -v digitalocean_game_state:/state caddy:2.8-alpine -c '
            set -e
            test -d /state/shards/global-official
            rm -rf /state/shards/hieusro-test
            rm -f /state/cluster/gameworld-identity-hieusro-test.jwt
            test -d /state/shards/global-official
            test ! -e /state/shards/hieusro-test
            test ! -e /state/cluster/gameworld-identity-hieusro-test.jwt
          '

          echo '=== Remove legacy TEST/diagnostic containers ==='
          TEST_IDS="$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '$2 ~ /(test|diagnostic|phase|candidate)/ {print $1}')"
          if [ -n "$TEST_IDS" ]; then
            docker rm -f $TEST_IDS
          fi

          echo '=== Start production game ==='
          docker start digitalocean-game-1 >/dev/null

          echo '=== Remove unused old images after TEST containers are gone ==='
          docker image prune -a -f >/dev/null

          echo '=== Confirm only production containers remain running ==='
          docker ps --format '{{.Names}} {{.Status}}'
          if docker ps -a --format '{{.Names}}' | grep -Ei 'test|diagnostic|phase|candidate'; then
            echo 'TEST_CONTAINER_REMAINS=1' >&2
            exit 1
          fi
          echo 'TEST_RUNTIME_PURGED=1'
          REMOTE
      - name: Verify LIVE and old TEST URLs
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://play.143-198-217-75.sslip.io'
          OLD='https://baseline-lite.143-198-217-75.sslip.io'
          for attempt in $(seq 1 120); do
            live_code=$(curl -k -sS -o /tmp/live -w '%{http_code}' --max-time 15 "$LIVE/" || true)
            cat_code=$(curl -k -sS -H 'X-OpenSRO-Protocol: 6' -o /tmp/catalog -w '%{http_code}' --max-time 15 "$LIVE/api/title/servers" || true)
            test_code=$(curl -k -sS -o /tmp/test -w '%{http_code}' --max-time 15 "$LIVE/shards/hieusro-test/transport/readyz" || true)
            old_code=$(curl -k -sS -o /tmp/old -w '%{http_code}' --max-time 15 "$OLD/" || true)
            echo "attempt=$attempt live=$live_code catalog=$cat_code test=$test_code baseline=$old_code"
            if [ "$live_code" = 200 ] && [ "$cat_code" = 200 ] && ! grep -q 'hieusro-test' /tmp/catalog 2>/dev/null && [ "$test_code" = 404 ] && [ "$old_code" = 404 ]; then
              echo HIEUSRO_LIVE_ONLY_VERIFIED=1
              cat /tmp/catalog
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
