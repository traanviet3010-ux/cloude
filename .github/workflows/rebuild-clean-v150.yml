name: Rebuild clean LIVE v1.150 client

on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths:
      - '.github/workflows/rebuild-clean-v150.yml'

permissions:
  contents: read

concurrency:
  group: hieusro-v150-clean-client
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 60
    env:
      OPEN_SRO_COMMIT: 4f6919d6900d169b89e75647e56c99ca8ebd5cfb
      LIVE: https://play.143-198-217-75.sslip.io
    steps:
      - uses: actions/checkout@v4

      - name: Build clean pinned v1.150 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends fonts-liberation2 python3-venv >/dev/null
          sudo mkdir -p /src /out
          sudo chown "$USER:$USER" /src /out
          git clone -q https://github.com/opensro-dev/opensro.git /src/opensro
          cd /src/opensro
          git checkout -q "$OPEN_SRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$OPEN_SRO_COMMIT"
          echo "OPEN_SRO_HEAD=$(git rev-parse HEAD)"
          corepack enable
          corepack pnpm install --frozen-lockfile
          python3 -m venv /tmp/hieusro-build-venv
          source /tmp/hieusro-build-venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-build.txt
          bash "$GITHUB_WORKSPACE/server-build/build-client-next.sh"
          test -s /out/client-public/index.html
          test -s /out/client-public/viewer.html
          find /out/client-public/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -print | sort >/tmp/new-static-files
          test -s /tmp/new-static-files
          tar -C /out/client-public -czf /tmp/hieusro-client-v150-clean.tgz .
          sha256sum /tmp/hieusro-client-v150-clean.tgz

      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST_KEY" && test -n "$VPS_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F 143.198.217.75 -f ~/.ssh/known_hosts >/dev/null

      - name: Swap in clean client only
        shell: bash
        run: |
          set -euo pipefail
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            /tmp/hieusro-client-v150-clean.tgz hieusro-ops@143.198.217.75:/tmp/hieusro-client-v150-clean.tgz
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            hieusro-ops@143.198.217.75 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          CID=''
          for id in $(docker ps -q); do
            if docker exec "$id" test -d /opt/hieusro/client-edge/public 2>/dev/null; then CID="$id"; break; fi
          done
          test -n "$CID"
          BACKUP=/opt/hieusro/backups/pre-clean-v150-client-20261017-0814
          mkdir -p "$BACKUP"
          docker cp "$CID:/opt/hieusro/client-edge/public" "$BACKUP/public" >/dev/null
          printf '%s\n' 'base=4f6919d6900d169b89e75647e56c99ca8ebd5cfb' 'type=clean-v150-client' > "$BACKUP/build.txt"
          docker cp /tmp/hieusro-client-v150-clean.tgz "$CID:/tmp/hieusro-client-v150-clean.tgz" >/dev/null
          docker exec "$CID" sh -lc '
            set -eu
            ROOT=/opt/hieusro/client-edge
            NEW="$ROOT/public.clean-v150-0814"
            mkdir -p "$NEW"
            tar -xzf /tmp/hieusro-client-v150-clean.tgz -C "$NEW"
            test -s "$NEW/index.html"
            test -s "$NEW/viewer.html"
            mv "$ROOT/public" "$ROOT/public.replaced-0814"
            mv "$NEW" "$ROOT/public"
          '
          REMOTE
          touch /tmp/hieusro-client-deployed

      - name: Verify LIVE
        shell: bash
        run: |
          set -euo pipefail
          ROOT_CODE=$(curl -k -sS --max-time 30 -o /tmp/root.html -w '%{http_code}' "$LIVE/")
          echo "ROOT HTTP=$ROOT_CODE"
          test "$ROOT_CODE" = 200
          grep -Eqi '<!doctype|<html' /tmp/root.html
          MAIN=$(grep -oEm1 'assets/(bootstrap|entry)-[A-Za-z0-9_-]+\.js' /tmp/root.html)
          test -n "$MAIN"
          echo "MAIN_BUNDLE=$MAIN"
          test "$(curl -k -sS --max-time 30 -o /dev/null -w '%{http_code}' "$LIVE/$MAIN")" = 200
          API_CODE=$(curl -k -sS --max-time 30 -H 'X-OpenSRO-Protocol: 6' -o /tmp/catalog.json -w '%{http_code}' "$LIVE/api/title/servers")
          echo "CATALOG HTTP=$API_CODE BODY=$(cat /tmp/catalog.json)"
          test "$API_CODE" = 200
          grep -q 'global-official' /tmp/catalog.json
          grep -q '"operating":true' /tmp/catalog.json
          GM_CODE=$(curl -k -sS --max-time 30 -o /dev/null -w '%{http_code}' "$LIVE/gm/" || true)
          echo "GM HTTP=$GM_CODE"
          case "$GM_CODE" in 2??|3??|401|403) :;; *) exit 1;; esac
          while IFS= read -r file; do
            rel=${file#/out/client-public/}
            code=$(curl -k -sS --max-time 30 -o /dev/null -w '%{http_code}' "$LIVE/$rel")
            echo "STATIC $rel HTTP=$code"
            case "$code" in 2??|3??) :;; *) exit 1;; esac
          done </tmp/new-static-files
          echo 'HIEUSRO_V150_CLEAN_CLIENT_VERIFIED=1'

      - name: Roll back if verification fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/hieusro-client-deployed ]; then exit 0; fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
            hieusro-ops@143.198.217.75 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          CID=''
          for id in $(docker ps -q); do
            if docker exec "$id" test -d /opt/hieusro/client-edge/public 2>/dev/null; then CID="$id"; break; fi
          done
          test -n "$CID"
          docker exec "$CID" sh -lc '
            set -eu
            ROOT=/opt/hieusro/client-edge
            if [ -d "$ROOT/public.replaced-0814" ]; then
              mv "$ROOT/public" "$ROOT/public.clean-failed-0814"
              mv "$ROOT/public.replaced-0814" "$ROOT/public"
            fi
          '
          REMOTE
          curl -k -fsS --max-time 30 -o /dev/null "$LIVE/"
          echo 'LIVE_STATIC_CLIENT_ROLLED_BACK=1'

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
