name: Repair HieuSRO shard leases after TEST cleanup
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/repair-shard-leases.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 15
    steps:
      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Back up lease metadata, remove TEST lease, restart LIVE
        shell: bash
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 "sudo -n bash -s" <<'REMOTE'
          set -euo pipefail
          docker stop digitalocean-game-1 >/dev/null 2>&1 || true
          ROOT=/var/lib/docker/volumes/digitalocean_game_state/_data
          LEASES="$ROOT/cluster/shard-leases.json"
          test -s "$LEASES"
          cp -a "$LEASES" "$LEASES.pre-test-cleanup"
          python3 - "$LEASES" <<'PY'
          import json, sys, os, tempfile
          path=sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              data=json.load(f)
          leases=data.get('leases', [])
          data['leases']=[x for x in leases if x.get('shardId') != 'hieusro-test']
          ids=[x.get('shardId') for x in data['leases']]
          if 'global-official' not in ids:
              raise SystemExit('global-official lease missing; refusing write')
          if 'hieusro-test' in ids:
              raise SystemExit('TEST lease still present')
          tmp=path+'.tmp'
          with open(tmp, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          os.replace(tmp, path)
          print('LEASES_AFTER=', ids)
          PY
          test -d "$ROOT/shards/global-official"
          test ! -d "$ROOT/shards/hieusro-test"
          if [ -f "$ROOT/shards/global-official/authority/authority.lock" ]; then
            mv "$ROOT/shards/global-official/authority/authority.lock" "$ROOT/shards/global-official/authority/authority.lock.pre-lease-repair"
          fi
          docker start digitalocean-game-1 >/dev/null
          echo TEST_LEASE_REMOVED=1
          REMOTE
      - name: Verify LIVE-only public surface
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://play.143-198-217-75.sslip.io'
          OLD='https://baseline-lite.143-198-217-75.sslip.io'
          for attempt in $(seq 1 120); do
            live_code=$(curl -k -sS -o /tmp/live -w '%{http_code}' --max-time 15 "$LIVE/" || true)
            cat_code=$(curl -k -sS -H 'X-OpenSRO-Protocol: 6' -o /tmp/catalog -w '%{http_code}' --max-time 15 "$LIVE/api/title/servers" || true)
            test_code=$(curl -k -sS -o /tmp/test -w '%{http_code}' --max-time 15 "$LIVE/shards/hieusro-test/transport/readyz" || true)
            old_code=$(curl -k -sS -o /tmp/old -w '%{http_code}' --max-time 15 "$OLD/" || true)
            echo "attempt=$attempt live=$live_code catalog=$cat_code test=$test_code baseline=$old_code"
            if [ "$live_code" = 200 ] && [ "$cat_code" = 200 ] && ! grep -q 'hieusro-test' /tmp/catalog 2>/dev/null && [ "$test_code" = 404 ] && [ "$old_code" = 404 ]; then
              cat /tmp/catalog
              echo HIEUSRO_LIVE_ONLY_VERIFIED=1
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
