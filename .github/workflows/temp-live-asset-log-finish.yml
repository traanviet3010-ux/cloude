name: Finish temporary LIVE asset timing log
# cleanup verification rerun 2026-10-16
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/temp-live-asset-log-finish.yml']
permissions:
  contents: read
jobs:
  finish:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 10
    steps:
      - name: Checkout measurement scripts
        uses: actions/checkout@v4

      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F 143.198.217.75 -f ~/.ssh/known_hosts >/dev/null

      - name: Capture raw temporary asset log
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 \
            "sudo -n bash -lc 'cd /opt/hieusro/src/deploy/digitalocean; GAME=\$(docker compose --env-file .env -f compose.yml ps -q game); test -n \"\$GAME\"; docker exec \"\$GAME\" cat /tmp/hieusro-asset-temp.log'" \
            > /tmp/hieusro-asset-temp.log
          wc -l /tmp/hieusro-asset-temp.log
          wc -c /tmp/hieusro-asset-temp.log

      - name: Analyze capture
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/analyze-temp-asset-log.py /tmp/hieusro-asset-temp.log | tee /tmp/hieusro-asset-summary.txt

      - name: Disable temporary logger and restore nginx
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 'sudo -n bash -s' \
            < .github/scripts/temp-live-asset-log-disable.sh

      - name: Upload measurement files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hieusro-live-asset-capture-20261016
          path: |
            /tmp/hieusro-asset-temp.log
            /tmp/hieusro-asset-summary.txt
          retention-days: 7

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
