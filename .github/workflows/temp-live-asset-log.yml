name: LIVE v1.150 iOS asset quota hotfix

on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths:
      - '.github/workflows/temp-live-asset-log.yml'

permissions:
  contents: read

concurrency:
  group: hieusro-v150-mobile-entry-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 60
    env:
      OPEN_SRO_COMMIT: 4f6919d6900d169b89e75647e56c99ca8ebd5cfb
      PATCH_920: 09083631c9bc50136db2c342445212ee6df72452
      PATCH_950: 60e19fabf28a20d17c3794a6749366250815af73
      PATCH_951: 197c29b2d3e09c9dff857fdeee63425e7bdc6b4e
      LIVE: https://play.143-198-217-75.sslip.io
    steps:
      - name: Checkout HieuSRO operations branch
        uses: actions/checkout@v4

      - name: Build patched v1.150 client only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends fonts-liberation2 python3-venv >/dev/null
          sudo mkdir -p /src /out
          sudo chown "$USER:$USER" /src /out
          git clone -q https://github.com/opensro-dev/opensro.git /src/opensro
          cd /src/opensro
          git config user.name hieusro-hotfix
          git config user.email hieusro-hotfix@localhost
          git checkout -q "$OPEN_SRO_COMMIT"
          test "$(git rev-parse HEAD)" = "$OPEN_SRO_COMMIT"
          git cherry-pick -x "$PATCH_920"
          git cherry-pick -x "$PATCH_950"
          git cherry-pick -x "$PATCH_951"
          corepack enable
          corepack pnpm install --frozen-lockfile
          node --test apps/client-next/tests/runtime/packs.test.mjs
          python3 -m venv /tmp/hieusro-build-venv
          source /tmp/hieusro-build-venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-build.txt
          bash "$GITHUB_WORKSPACE/server-build/build-client-next.sh"
          test -s /out/client-public/index.html
          test -s /out/client-public/viewer.html
          find /out/client-public/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -print | sort >/tmp/new-static-files
          test -s /tmp/new-static-files
          tar -C /out/client-public -czf /tmp/hieusro-client-mobile-fix.tgz .
          sha256sum /tmp/hieusro-client-mobile-fix.tgz

      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST_KEY" && test -n "$VPS_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F 143.198.217.75 -f ~/.ssh/known_hosts >/dev/null

      - name: Backup and atomically swap static client
        shell: bash
        run: |
          set -euo pipefail
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 /tmp/hieusro-client-mobile-fix.tgz \
            hieusro-ops@143.198.217.75:/tmp/hieusro-client-mobile-fix.tgz
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          CID=''
          for id in $(docker ps -q); do
            if docker exec "$id" test -d /opt/hieusro/client-edge/public 2>/dev/null; then CID="$id"; break; fi
          done
          test -n "$CID"
          BACKUP=/opt/hieusro/backups/mobile-entry-fix-951-20261017-1506
          rm -rf "$BACKUP"
          mkdir -p "$BACKUP"
          docker cp "$CID:/opt/hieusro/client-edge/public" "$BACKUP/public" >/dev/null
          docker cp /tmp/hieusro-client-mobile-fix.tgz "$CID:/tmp/hieusro-client-mobile-fix.tgz" >/dev/null
          docker exec "$CID" sh -lc '
            set -eu
            ROOT=/opt/hieusro/client-edge
            rm -rf "$ROOT/public.mobile-new" "$ROOT/public.mobile-prev"
            cp -a "$ROOT/public" "$ROOT/public.mobile-new"
            tar -xzf /tmp/hieusro-client-mobile-fix.tgz -C "$ROOT/public.mobile-new"
            test -s "$ROOT/public.mobile-new/index.html"
            test -s "$ROOT/public.mobile-new/viewer.html"
            mv "$ROOT/public" "$ROOT/public.mobile-prev"
            mv "$ROOT/public.mobile-new" "$ROOT/public"
          '
          printf '%s\n' \
            'base=4f6919d6900d169b89e75647e56c99ca8ebd5cfb' \
            'patch920=09083631c9bc50136db2c342445212ee6df72452' \
            'patch950=60e19fabf28a20d17c3794a6749366250815af73' \
            'patch951=197c29b2d3e09c9dff857fdeee63425e7bdc6b4e' > "$BACKUP/build.txt"
          rm -f /tmp/hieusro-client-mobile-fix.tgz
          REMOTE
          touch /tmp/hieusro-client-deployed

      - name: Verify LIVE from outside VPS
        shell: bash
        run: |
          set -euo pipefail
          status() {
            local label="$1" url="$2" code
            code=$(curl -k -sS --max-time 30 -o /dev/null -w '%{http_code}' "$url")
            echo "$label HTTP=$code"
            case "$code" in 2??|3??) return 0;; *) return 1;; esac
          }

          ROOT_CODE=$(curl -k -sS --max-time 30 -o /tmp/root.html -w '%{http_code}' "$LIVE/")
          echo "ROOT HTTP=$ROOT_CODE"
          test "$ROOT_CODE" = 200
          grep -Eqi '<!doctype|<html' /tmp/root.html
          MAIN=$(grep -oEm1 'assets/(bootstrap|entry)-[A-Za-z0-9_-]+\.js' /tmp/root.html)
          test -n "$MAIN"
          echo "MAIN_BUNDLE=$MAIN"
          status MAIN "$LIVE/$MAIN"

          API_CODE=$(curl -k -sS --max-time 30 -H 'X-OpenSRO-Protocol: 6' -o /tmp/catalog.json -w '%{http_code}' "$LIVE/api/title/servers")
          echo "CATALOG HTTP=$API_CODE BODY=$(cat /tmp/catalog.json)"
          test "$API_CODE" = 200
          grep -q 'global-official' /tmp/catalog.json
          grep -q '"operating":true' /tmp/catalog.json

          for n in 1 2; do
            code=$(curl -k -sS --max-time 30 -D "/tmp/m$n.h" -o /dev/null -w '%{http_code}' "$LIVE/assets/packs/manifest.json")
            cache=$(awk 'BEGIN{IGNORECASE=1} /^x-hieusro-asset-cache:/{gsub("\r",""); print $2}' "/tmp/m$n.h" | tail -1)
            source=$(awk 'BEGIN{IGNORECASE=1} /^x-hieusro-asset-source:/{gsub("\r",""); print $2}' "/tmp/m$n.h" | tail -1)
            echo "MANIFEST$n HTTP=$code CACHE=${cache:-none} SOURCE=${source:-none}"
            test "$code" = 200
            test "$source" = vps-mirror
          done

          GM_CODE=$(curl -k -sS --max-time 30 -o /dev/null -w '%{http_code}' "$LIVE/gm/" || true)
          echo "GM HTTP=$GM_CODE"
          case "$GM_CODE" in 2??|3??|401|403) :;; *) echo 'GM route unreachable'; exit 1;; esac

          while IFS= read -r file; do
            rel=${file#/out/client-public/}
            status STATIC "$LIVE/$rel"
          done </tmp/new-static-files

          echo 'HIEUSRO_V150_IOS_QUOTA_HOTFIX_VERIFIED=1'

      - name: Roll back static client on verification failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/hieusro-client-deployed ]; then
            echo 'No LIVE client swap occurred; nothing to roll back.'
            exit 0
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          CID=''
          for id in $(docker ps -q); do
            if docker exec "$id" test -d /opt/hieusro/client-edge/public 2>/dev/null; then CID="$id"; break; fi
          done
          test -n "$CID"
          docker exec "$CID" sh -lc '
            set -eu
            ROOT=/opt/hieusro/client-edge
            if [ -d "$ROOT/public.mobile-prev" ]; then
              rm -rf "$ROOT/public.mobile-failed"
              mv "$ROOT/public" "$ROOT/public.mobile-failed"
              mv "$ROOT/public.mobile-prev" "$ROOT/public"
            fi
          '
          REMOTE
          curl -k -fsS --max-time 30 -o /dev/null "$LIVE/"
          echo 'LIVE_STATIC_CLIENT_ROLLED_BACK=1'

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
