name: Temporary LIVE asset timing log
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths:
      - '.github/workflows/temp-live-asset-log.yml'
permissions:
  contents: read
jobs:
  assetlog:
    runs-on: ubuntu-24.04
    environment: hieusro-vps
    timeout-minutes: 30
    steps:
      - name: Checkout operations script
        uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          VPS_HOST_KEY: ${{ secrets.HIEUSRO_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.HIEUSRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F 143.198.217.75 -f ~/.ssh/known_hosts >/dev/null
      - name: Apply manifest cache fix and prewarm startup packs
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 hieusro-ops@143.198.217.75 'sudo -n bash -s' \
            < .github/scripts/apply-live-manifest-prewarm-fix.sh
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
