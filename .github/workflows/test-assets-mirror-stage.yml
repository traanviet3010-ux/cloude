name: Test HieuSRO asset mirror staging

on:
  push:
    branches: [hieusro-assets-mirror-stage]
    paths:
      - 'server-build/runtime-nginx.conf'
      - 'server-build/prewarm-assets.py'
      - 'deploy/digitalocean/compose.yml'
      - 'deploy/digitalocean/backup.sh'
      - 'deploy/digitalocean/update.sh'
      - 'deploy/digitalocean/patch-mobile-dockerfile.py'
      - '.github/workflows/test-assets-mirror-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile server-build/prewarm-assets.py deploy/digitalocean/patch-mobile-dockerfile.py

      - name: Validate Dockerfile patch
        run: |
          cp server-build/Dockerfile.allinone /tmp/Dockerfile.allinone
          sed -i 's/SRO_BUILD_JOBS=2/SRO_BUILD_JOBS=1/' /tmp/Dockerfile.allinone
          sed -i 's#RUN corepack pnpm assets build world-outdoor#RUN NODE_OPTIONS="--max-old-space-size=3072" corepack pnpm assets build world-outdoor#' /tmp/Dockerfile.allinone
          python3 deploy/digitalocean/patch-mobile-dockerfile.py /tmp/Dockerfile.allinone
          grep -q 'COPY prewarm-assets.py /opt/hieusro/prewarm-assets.py' /tmp/Dockerfile.allinone
          grep -q '/var/cache/hieusro-assets' /tmp/Dockerfile.allinone

      - name: Validate Compose
        env:
          HIEUSRO_HOST: play.example.test
          HIEUSRO_PORTAL_HOST: portal.example.test
          HIEUSRO_PROVISIONING_TOKEN: test-provisioning-token-0000000000000000
          HIEUSRO_GM_ADMIN_PASSWORD: test-password
          HIEUSRO_GM_SESSION_SECRET: test-session-secret-000000000000000000
        run: docker compose -f deploy/digitalocean/compose.yml config >/tmp/compose.yml

      - name: Validate Nginx syntax
        run: |
          mkdir -p /tmp/hieusro-cache /tmp/client/public
          docker run --rm \
            -v "$PWD/server-build/runtime-nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v /tmp/hieusro-cache:/var/cache/hieusro-assets \
            -v /tmp/client:/opt/hieusro/client-edge:ro \
            nginx:1.26-bookworm nginx -t

      - name: Exercise prewarm SHA verification
        run: |
          cat >/tmp/mock_assets.py <<'PY'
          import hashlib, json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          startup=b'startup-pack-bytes'
          region=b'region-61a8-pack-bytes'
          sh=lambda b: hashlib.sha256(b).hexdigest()
          sp=f"/assets/packs/native-ui-000-{sh(startup)[:12]}.bin"
          rp=f"/assets/packs/outdoor-world-001-{sh(region)[:12]}.bin"
          manifest={
            'format':'sro-asset-pack-index',
            'groups':[
              {'name':'native-ui','load':'startup','packs':[{'path':sp,'sha256':sh(startup)}]},
              {'name':'outdoor-world','load':'manual','packs':[{'path':rp,'sha256':sh(region)}]},
            ],
            'assets':[{'path':'/assets/world/61a8/region.json','packPath':rp}],
          }
          bodies={
            '/assets/packs/manifest.json':json.dumps(manifest).encode(),
            '/assets/manifest.json':b'{}', sp:startup, rp:region,
          }
          class H(BaseHTTPRequestHandler):
            def do_GET(self):
              body=bodies.get(self.path)
              if body is None:
                self.send_response(404); self.end_headers(); return
              self.send_response(200)
              self.send_header('Content-Length',str(len(body)))
              self.send_header('X-HieuSRO-Asset-Cache','MISS')
              self.end_headers(); self.wfile.write(body)
            def log_message(self,*args): pass
          ThreadingHTTPServer(('127.0.0.1',18080),H).serve_forever()
          PY
          python3 /tmp/mock_assets.py &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          HIEUSRO_PREWARM_BASE=http://127.0.0.1:18080 \
            python3 server-build/prewarm-assets.py | tee /tmp/prewarm.log
          grep -q 'PREWARM_SUMMARY ok=2 fail=0' /tmp/prewarm.log
