name: Verify HieuSRO LIVE asset mirror

on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/verify-live-asset-mirror.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify LIVE frontend, catalog and asset mirror
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://play.143-198-217-75.sslip.io'

          echo '=== ROOT ==='
          curl -k -fsS -D /tmp/root.headers -o /tmp/root.body --max-time 20 "$LIVE/"
          grep -Eqi '<!doctype|<html' /tmp/root.body
          awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|content-type:|cache-control:|alt-svc:)/{print}' /tmp/root.headers

          echo '=== CATALOG ==='
          curl -k -fsS -H 'X-OpenSRO-Protocol: 6' -D /tmp/catalog.headers -o /tmp/catalog.body --max-time 20 "$LIVE/api/title/servers"
          grep -q 'global-official' /tmp/catalog.body
          cat /tmp/catalog.body

          echo '=== PACK MANIFEST PASS 1 ==='
          curl -k -fsS -D /tmp/m1.headers -o /tmp/manifest.json --max-time 30 "$LIVE/assets/packs/manifest.json"
          awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|x-hieusro-asset-cache:|x-hieusro-asset-source:|cache-control:|etag:|last-modified:)/{print}' /tmp/m1.headers

          echo '=== PACK MANIFEST PASS 2 ==='
          curl -k -fsS -D /tmp/m2.headers -o /tmp/manifest2.json --max-time 30 "$LIVE/assets/packs/manifest.json"
          awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|x-hieusro-asset-cache:|x-hieusro-asset-source:|cache-control:|etag:|last-modified:)/{print}' /tmp/m2.headers
          cmp /tmp/manifest.json /tmp/manifest2.json

          python3 - <<'PY' >/tmp/pack-meta
          import json
          d=json.load(open('/tmp/manifest2.json'))
          chosen=None
          for g in d.get('groups', []):
              if g.get('load') == 'startup' and g.get('packs'):
                  chosen=(g.get('name'), g['packs'][0])
                  break
          if not chosen:
              for g in d.get('groups', []):
                  if g.get('packs'):
                      chosen=(g.get('name'), g['packs'][0])
                      break
          if not chosen:
              raise SystemExit('no pack found')
          name, p = chosen
          print(name)
          print(p['path'])
          print(p.get('bytes',0))
          print(p.get('sha256',''))
          PY
          GROUP=$(sed -n '1p' /tmp/pack-meta)
          PACK=$(sed -n '2p' /tmp/pack-meta)
          PACK_BYTES=$(sed -n '3p' /tmp/pack-meta)
          PACK_SHA=$(sed -n '4p' /tmp/pack-meta)
          echo "SELECTED group=$GROUP pack=$PACK bytes=$PACK_BYTES sha256=$PACK_SHA"

          echo '=== PACK RANGE PASS 1 (8 MiB max) ==='
          curl -k -fsS -H 'Range: bytes=0-8388607' -D /tmp/p1.headers -o /tmp/p1.bin --max-time 90 \
            -w 'pass=1 status=%{http_code} bytes=%{size_download} seconds=%{time_total} speed_Bps=%{speed_download}\n' "$LIVE$PACK"
          awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|content-range:|x-hieusro-asset-cache:|x-hieusro-asset-source:|cache-control:|etag:|last-modified:)/{print}' /tmp/p1.headers

          echo '=== PACK RANGE PASS 2 (8 MiB max) ==='
          curl -k -fsS -H 'Range: bytes=0-8388607' -D /tmp/p2.headers -o /tmp/p2.bin --max-time 90 \
            -w 'pass=2 status=%{http_code} bytes=%{size_download} seconds=%{time_total} speed_Bps=%{speed_download}\n' "$LIVE$PACK"
          awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|content-range:|x-hieusro-asset-cache:|x-hieusro-asset-source:|cache-control:|etag:|last-modified:)/{print}' /tmp/p2.headers
          cmp /tmp/p1.bin /tmp/p2.bin

          # The route itself must be the VPS mirror. Cache state can be HIT,
          # REVALIDATED, EXPIRED or MISS depending on prewarm timing, but the
          # second manifest request should never fall back to the old Node edge.
          grep -qi '^x-hieusro-asset-source: vps-mirror' /tmp/m2.headers
          grep -qi '^x-hieusro-asset-source: vps-mirror' /tmp/p2.headers
          echo 'HIEUSRO_ASSET_MIRROR_ROUTE_VERIFIED=1'
