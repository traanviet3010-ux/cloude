name: Verify HieuSRO LIVE frontend repair
on:
  push:
    branches: [hieusro-secure-vps-ops]
    paths: ['.github/workflows/verify-live-frontend-repair.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for production auto-update and verify frontend
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://play.143-198-217-75.sslip.io'
          for attempt in $(seq 1 100); do
            echo "VERIFY attempt=$attempt time=$(date -u +%FT%TZ)"
            root_code=$(curl -k -sS -o /tmp/root -D /tmp/root.headers -w '%{http_code}' --max-time 15 "$LIVE/" || true)
            cat_code=$(curl -k -sS -H 'X-OpenSRO-Protocol: 6' -o /tmp/catalog -w '%{http_code}' --max-time 15 "$LIVE/api/title/servers" || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' /tmp/root.headers 2>/dev/null | tr -d '\r' | tail -1)
            echo "root=$root_code content_type=$ctype catalog=$cat_code"
            head -c 180 /tmp/root 2>/dev/null || true; echo
            if [ "$root_code" = 200 ] && [ "$cat_code" = 200 ] && ! grep -q 'runtime gateway online' /tmp/root 2>/dev/null && grep -Eqi '<!doctype|<html' /tmp/root 2>/dev/null; then
              echo 'HIEUSRO_LIVE_FRONTEND_REPAIRED=1'
              exit 0
            fi
            sleep 10
          done
          echo 'LIVE frontend did not recover within verification window.' >&2
          exit 1
