# HieuSRO Mobile Lite V1 — isolated CLIENT testing gateway.
# UI runs on this service; game API, WebSocket and asset packs are proxied to
# the existing independent Preview TEST, never to production LIVE.
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types application/javascript application/json text/css text/javascript;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 10000;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 5m;

        location = /__mobile/health {
            add_header Cache-Control "no-store" always;
            add_header Content-Type "application/json; charset=utf-8" always;
            return 200 '{"service":"HieuSRO Mobile Lite","role":"client-only","upstream":"icons-preview-test","status":"ready"}';
        }
        # GM is purposefully NOT forwarded. Avoid exposing/administering an
        # existing shard from the separate mobile client testing endpoint.
        location ^~ /gm/ { return 404; }

        # No service worker and no long-lived HTML cache across deploys.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }
        # Verified, full 213-pack Render CDN mirror (TEST only).
        # Same-origin proxy avoids CORS and keeps OpenSRO asset URLs unchanged.
        # Do not send asset requests to the old icons-preview fallback.
        location = /assets/packs/manifest.json {
            limit_except GET HEAD { deny all; }
            proxy_pass https://hieusro-assets-cdn-test-20261020.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_set_header Host hieusro-assets-cdn-test-20261020.onrender.com;
            proxy_set_header Accept-Encoding identity;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Origin "";
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache" always;
            add_header X-HieuSRO-Asset-Source "render-cdn-test" always;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
        location ^~ /assets/packs/ {
            limit_except GET HEAD { deny all; }
            gzip off;
            proxy_pass https://hieusro-assets-cdn-test-20261020.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_set_header Host hieusro-assets-cdn-test-20261020.onrender.com;
            proxy_set_header Accept-Encoding identity;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header Origin "";
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_read_timeout 180s;
            proxy_buffering off;
            add_header X-HieuSRO-Asset-Source "render-cdn-test" always;
        }
        location / {
            # Serve only the locally built patched JavaScript/CSS. Every
            # unshipped licensed asset, game API or WebSocket goes upstream.
            try_files $uri $uri/ @preview_backend;
        }
        location @preview_backend {
            proxy_pass https://hieusro-icons-preview-20261019.onrender.com;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host hieusro-icons-preview-20261019.onrender.com;
            proxy_set_header Origin https://hieusro-icons-preview-20261019.onrender.com;
            proxy_set_header Referer https://hieusro-icons-preview-20261019.onrender.com/;
            proxy_set_header X-Forwarded-Host hieusro-icons-preview-20261019.onrender.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 300s;
        }
    }
}
