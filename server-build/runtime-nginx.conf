worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=provisioning:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=gmcontrol:10m rate=120r/m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 10000;
    server_name _;

    location = /healthz {
      proxy_pass http://127.0.0.1:8787/healthz;
    }

    location = /readyz {
      proxy_pass http://127.0.0.1:8787/readyz;
    }

    location /i18n/ {
      alias /opt/hieusro/i18n/;
      limit_except GET HEAD { deny all; }
      default_type application/json;
      add_header Cache-Control "public, max-age=300" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8787/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /provision/ {
      limit_req zone=provisioning burst=10 nodelay;
      limit_except GET POST PUT { deny all; }
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:8789/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8789;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location /gm-api/ {
      limit_req zone=gmcontrol burst=30 nodelay;
      limit_except GET POST PUT { deny all; }
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:8793/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8793;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location /gm-version-api/ {
      limit_req zone=gmcontrol burst=20 nodelay;
      limit_except GET POST { deny all; }
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:8794/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8794;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location ^~ /shards/hieusro-test/ {
      return 404;
    }

    location /shards/global-official/ {
      proxy_pass http://127.0.0.1:8788/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://127.0.0.1:8795;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
