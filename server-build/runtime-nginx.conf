worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  etag on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  proxy_cache_path /var/cache/hieusro-assets
    levels=1:2
    keys_zone=hieusro_assets:64m
    max_size=8g
    inactive=30d
    use_temp_path=off;

  limit_req_zone $binary_remote_addr zone=provisioning:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=gmcontrol:10m rate=120r/m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Only content-addressed pack URLs get immutable browser caching here.
  # Other files remain short-lived and revalidatable; this avoids pinning
  # loose JSON or manifests stale on mobile clients.
  map $uri $asset_client_cache_control {
    default "public, max-age=300, must-revalidate";
    ~*^/assets/packs/.+-[0-9]+-[a-f0-9]+\.bin$ "public, max-age=31536000, immutable";
  }

  server {
    listen 10000;
    server_name _;

    location = /healthz {
      proxy_pass http://127.0.0.1:8787/healthz;
    }

    location = /readyz {
      proxy_pass http://127.0.0.1:8787/readyz;
    }

    location /i18n/ {
      alias /opt/hieusro/i18n/;
      limit_except GET HEAD { deny all; }
      default_type application/json;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8787/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /provision/ {
      limit_req zone=provisioning burst=10 nodelay;
      limit_except GET POST PUT { deny all; }
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:8789/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8789;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location /gm-api/ {
      limit_req zone=gmcontrol burst=30 nodelay;
      limit_except GET POST PUT { deny all; }
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:8793/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8793;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location /gm-version-api/ {
      limit_req zone=gmcontrol burst=20 nodelay;
      limit_except GET POST { deny all; }
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:8794/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8794;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location ^~ /shards/hieusro-test/ {
      return 404;
    }

    location /shards/global-official/ {
      proxy_pass http://127.0.0.1:8788/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Localized catalogues must keep going through the client edge because it
    # rewrites the English route to the selected Vietnamese catalogue.
    location ~ ^/assets/text/(textuisystem|textzonename|textdataname|texthelp|messagetips)\.en\.json$ {
      proxy_pass http://127.0.0.1:8795;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Static shell assets are served directly from the pinned local client.
    # Missing game assets fall through to the persistent disk mirror below;
    # Node is no longer in the ordinary /assets/ hot path.
    location /assets/ {
      root /opt/hieusro/client-edge/public;
      try_files $uri @asset_upstream;
      add_header Cache-Control $asset_client_cache_control always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-HieuSRO-Asset-Source "local-client" always;
    }

    location @asset_upstream {
      proxy_pass https://opensro.online;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_ssl_name opensro.online;
      proxy_set_header Host opensro.online;
      proxy_set_header Cookie "";
      proxy_set_header Accept-Encoding "";
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_cache hieusro_assets;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "https://opensro.online$request_uri";
      proxy_cache_lock on;
      proxy_cache_lock_timeout 20s;
      proxy_cache_background_update on;
      proxy_cache_revalidate on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 30s;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;

      add_header Cache-Control $asset_client_cache_control always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-HieuSRO-Asset-Cache $upstream_cache_status always;
      add_header X-HieuSRO-Asset-Source "vps-mirror" always;
    }

    location / {
      proxy_pass http://127.0.0.1:8795;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
