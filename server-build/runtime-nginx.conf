worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=provisioning:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=gmcontrol:10m rate=120r/m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 10000;
    server_name _;

    location = /healthz {
      proxy_pass http://127.0.0.1:8787/healthz;
    }

    location = /readyz {
      proxy_pass http://127.0.0.1:8787/readyz;
    }

    # Localized catalogues are generated from the owner's v1.150 Media.pk2.
    # /opt/hieusro/i18n is an atomic symlink managed by version-control.py.
    location /i18n/ {
      alias /opt/hieusro/i18n/;
      limit_except GET HEAD { deny all; }
      default_type application/json;
      add_header Cache-Control "public, max-age=300" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Game APIs remain direct so the browser does not take an extra proxy hop.
    location = /api {
      proxy_pass http://127.0.0.1:8787/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8787/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /provision/ {
      limit_req zone=provisioning burst=10 nodelay;
      limit_except GET POST PUT { deny all; }
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:8789/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8789;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    # HieuSRO GM control: rate changes, operator notices and account actions.
    location /gm-api/ {
      limit_req zone=gmcontrol burst=30 nodelay;
      limit_except GET POST PUT { deny all; }
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:8793/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8793;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Version rollback is an internal runtime operation. The same private
    # GM control bearer is checked by the loopback service; no Render API key.
    location /gm-version-api/ {
      limit_req zone=gmcontrol burst=20 nodelay;
      limit_except GET POST { deny all; }
      client_max_body_size 8k;
      proxy_pass http://127.0.0.1:8794/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8794;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location /shards/global-official/ {
      proxy_pass http://127.0.0.1:8788/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Isolated HieuSRO TEST shard. It has its own GameWorld and authority DB.
    location /shards/hieusro-test/ {
      proxy_pass http://127.0.0.1:8797/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Web GM is isolated behind /gm while sharing this paid service.
    location = /gm {
      return 302 /gm/;
    }

    location /gm/ {
      proxy_pass http://127.0.0.1:8796/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
    }

    # Everything else is the HieuSRO client edge. It serves the pinned client
    # shell locally and proxies licensed game assets to the existing asset host.
    location / {
      proxy_pass http://127.0.0.1:8795;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
